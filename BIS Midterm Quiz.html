<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BIS Midterm Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b6f85;--bd:#e1e3ef;--ac:#5b5bd6;--ok:#16a34a;--okb:#e6f7ec;--no:#dc2626;--nob:#fdeaea;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1c1e2b;--tx:#eceefa;--mut:#9a9eb8;--bd:#2c2f42;--ac:#8b8bff;--okb:#12301f;--nob:#3a1818;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1c1e2b;--tx:#eceefa;--mut:#9a9eb8;--bd:#2c2f42;--ac:#8b8bff;--okb:#12301f;--nob:#3a1818;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
h1{font-size:24px;margin:6px 0}h2{font-size:19px;line-height:1.4;margin:10px 0 14px}
.mut{color:var(--mut);font-size:14px}
.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 16px;cursor:pointer;min-height:46px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.mode{display:block;width:100%;text-align:left;margin-top:10px}
.mode b{display:block;font-size:17px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;align-items:flex-start}
.opt:active{transform:scale(.99)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--ac)}.opt.sel .l{background:var(--ac);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no .l{background:var(--no);color:#fff}
.exp{background:var(--okb);border-left:4px solid var(--ok);border-radius:10px;padding:12px;margin:6px 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.g{font:inherit;font-size:13px;padding:7px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.g.a{background:var(--ac);color:#fff;border-color:var(--ac)}.g.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.g.no{background:var(--no);color:#fff;border-color:var(--no)}
.g.f{outline:2px solid #f59e0b}.g.cur{box-shadow:0 0 0 2px var(--tx)}
.score{font-size:48px;font-weight:800;color:var(--ac);text-align:center}
.rev{border-left:4px solid var(--no);padding-left:12px;margin:14px 0;font-size:15px}
@media(max-width:480px){.grid{grid-template-columns:repeat(8,1fr)}h2{font-size:18px}}
.warn{background:var(--nob);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}</style>
<div id="app"></div>
<script>
const VARS={"1": [["Which pair of devices does both input and output?", ["A scanner and a webcam", "A keyboard and a printer", "A printer and a projector", "A touchscreen and a headset with a microphone"], 3, "Тачскрин: чувствует палец (input) и показывает картинку (output). Гарнитура: микрофон (input) и динамик (output). Клавиатура только input, принтер только output."], ["In 1999 Hershey launched new ERP, CRM and SCM systems all at once, just before Halloween, and orders could not be filled. What went wrong?", ["The systems were too cheap", "The company used open-source software", "The company chose a phased start, one department at a time", "A Big Bang start in the busiest season, without enough testing and training"], 3, "Big Bang: всё в один день — быстро, но очень рискованно. Плюс худший момент (сезон). Phased безопаснее."], ["Open-source software has a license price of $0. What is the correct conclusion about its TCO?", ["TCO is always $0 for open-source software", "TCO counts only the license price", "TCO is not zero: setup, training, support and security still cost money", "Open source always has a higher TCO than proprietary software"], 2, "Пример из лекции: proprietary $10 000 против open source $9 500 за 3 года. Бесплатный щенок тоже требует корма и ветеринара."], ["Company A has 10 million customer records: many have no phone number, the same customer appears several times, and the newest data is three years old. Which quality characteristics does it fail?", ["None: a large volume guarantees good quality", "Consistent, complete and timely", "Accessible, clear and cost", "Only relevant"], 1, "Дубли → нет consistency, нет телефонов → не complete, данные 3-летней давности → не timely. Больше данных ≠ лучше информация."], ["You buy Bluetooth speakers. Your old laptop has no Bluetooth chip, and you place the speakers right next to it. Will they work together?", ["Yes, because they are very close", "Only at a distance of 100 meters", "Yes, but only within 10 meters", "No, both devices need a Bluetooth chip"], 3, "Bluetooth работает по радио на 10–100 м, но чип нужен на обеих сторонах. Расстояние не поможет."], ["In 2020 Public Health England kept test results in an old .xls file limited to 65,536 rows, and about 16,000 cases were lost. What is the lesson?", ["An application is a tool with limits: choose the right tool, such as a database", "The operating system was the main problem", "Excel should never be used by anyone", "The cloud always loses data"], 0, "Excel хорош для таблиц, но не для миллионов записей. Для больших объёмов нужна база данных."], ["What is the word size of a processor?", ["The amount of RAM it can use", "The number of bits it can handle at one time", "The number of cycles per second", "The number of cores it has"], 1, "Первые ПК — 8 бит, сегодня 64-битные процессоры. Больше бит за раз → больше работы за шаг."], ["A shop owner writes every sale in a paper notebook. Every evening she adds up the totals and decides what to order for tomorrow. Is this an information system?", ["No, because there is no network or Internet", "Yes, a manual IS: it turns data into information for a decision", "No, an IS must always use a computer", "Only if the notebook is scanned into a computer"], 1, "IS может быть ручной. Тест: превращают ли части данные в информацию для решения? Продажи → итоги → заказ на завтра."], ["A customer record says: date of birth 31 February 1990. Which data quality dimension does it fail?", ["Timeliness", "Validity", "Uniqueness", "Completeness"], 1, "31 февраля не существует — значение нарушает правила формата. Validity: соответствует ли формату и правилам."], ["A middle manager in a coffee shop reads a monthly cash flow statement. Which type of information system is this?", ["MIS (Management Information System)", "DSS (Decision Support System)", "TPS (Transaction Processing System)", "EIS (Executive Information System)"], 0, "TPS: бариста пробивает заказ. MIS: отчёты и бюджеты для среднего звена. DSS: интерактивный инструмент для краткосрочного решения. EIS: стратегия для топ-менеджмента."], ["A shop tries to have the lowest prices in town and also the fanciest stores and the best service at the same time. What is likely to happen?", ["It wins on both price and quality", "It gains a focus advantage", "It gets stuck in the middle: not cheap and not special", "It automatically becomes a cost leader"], 2, "Cost leader экономит, differentiator инвестирует в ценность. Пытаясь делать оба, компания проигрывает обоим. Нужен один ясный путь."], ["Firewalls, encryption and access control are built into the system itself. Which kind of control is this?", ["Application control", "Feedback", "General control", "Environment"], 0, "Application control живёт внутри ПО. General control — это человеческий процесс, например регулярная смена паролей."], ["You type a report for two hours and the power suddenly goes off. You never pressed Save. What do you lose?", ["Nothing, because RAM keeps data without power", "Only the operating system", "The unsaved work, because RAM is volatile", "Everything on the hard disk"], 2, "RAM хранит данные только при питании. Диск и SSD — non-volatile, но несохранённый текст был только в RAM."], ["A student learns «your test score is 85». In the DIKW pyramid, which level is this?", ["Information", "Data", "Knowledge", "Wisdom"], 0, "Data: «2 ошибки в тесте». Information: данные с контекстом, «у тебя 85». Knowledge: «нужно больше времени на учёбу». Wisdom: план на год."], ["Walmart's Fast Unloader scans and sorts inventory and cuts unloading time by one third. Which strategy does this system support?", ["Innovation", "Differentiation", "Focus", "Cost leadership"], 3, "Снижение затрат на разгрузку → можно держать цены ниже конкурентов. Это cost leadership."], ["A student's laptop becomes slow when she opens many programs at once. She can afford only one upgrade. Which one is most likely to help?", ["A bigger screen", "A faster Wi-Fi router", "More RAM", "A new keyboard"], 2, "Каждая открытая программа загружается в RAM. RAM заполнена → тормоза. Больше RAM → больше рабочего пространства."], ["Users report that one screen is confusing and slows the line. The manager receives the reports but never does anything. Which element of the IS is broken?", ["Output", "Feedback", "Processing", "Input"], 1, "Feedback замыкает цикл: пользователи сообщают → менеджер меняет → система улучшается. Если реакции нет, цикл разорван."], ["AlmaPay writes a rule: only the HR team may change salary data, and every change must be approved. Is this data governance or data management?", ["Both are exactly the same", "Data management: it is daily work", "Data governance: it sets rules and responsibility", "Neither: it is data analytics"], 2, "Governance отвечает «какие правила и кто решает». Management — сама работа: HR вносит одобренное изменение."], ["Which statement best describes a printer driver?", ["Enterprise software that connects departments", "System software that translates between the OS and one device", "Application software for editing documents", "Firmware saved permanently inside the router chip"], 1, "Driver = переводчик: каждое устройство «говорит» на своём языке, ОС их все не знает."], ["A lawn mowing service will have many new rivals very soon, while a medical device maker will not. Which of the Five Forces explains this?", ["Customer power", "Barriers to entry", "Supplier power", "Threat of substitutes"], 1, "Для стрижки газонов нужна только газонокосилка, барьер низкий. Для медтехники нужны инженеры и сертификация, барьер высокий."], ["Which of the four Vs of big data means the reliability, accuracy and trustworthiness of data?", ["Variety", "Velocity", "Volume", "Veracity"], 3, "Volume — объём, Variety — разнообразие форматов, Velocity — скорость поступления, Veracity — достоверность (мост к data quality)."], ["A coffee shop has an excellent ERP system. One barista gives her login to a friend so he can help. Which component has failed?", ["Hardware", "Software", "Procedures", "Data"], 2, "Техника работает, нарушено правило (кто может пользоваться системой, политика паролей). Технология без процедур небезопасна."], ["A taxi company is disrupted by a phone app that matches drivers and riders directly, with no dispatcher. Which kind of IT value is this mainly?", ["Information generation", "Transformation", "Commoditization", "Automation"], 1, "Меняется сама бизнес-модель, а не просто скорость задачи. Automation: та же работа быстрее. Information: лучшие решения."], ["A phone contains plastics, aluminum, silver, platinum and copper. Why is it much harder to recycle than a glass bottle?", ["The materials are densely packed and hard to separate", "Recycling phones is illegal in every country", "It contains no valuable materials", "Phones last more than ten years"], 0, "Разделить материалы — трудоёмко, это «обратное производство». Поэтому e-waste часто отправляют в другие страны."], ["AlmaPay stores the same customer in billing, support and marketing. The name is written three ways and the phone numbers differ. What should the company create?", ["Master data management with one trusted record (single source of truth)", "More copies of the operational data", "A separate database for each department", "A bigger analytic report"], 0, "Клиенты, товары, сотрудники — это master data. Для них нужна одна достоверная запись."], ["An engineer finishes a design of a spare part on her computer and wants a real model she can hold and test today. Which output device does she need?", ["A scanner", "Speakers", "A 3D printer", "A projector"], 2, "3D-принтер добавляет материал слой за слоем и делает физический объект: прототипы, протезы, детали самолётов."], ["Marketing wants its own IT team for faster service; the CIO says one central team is better. What does the lecture suggest to get both control and speed?", ["Close the central IT department", "Ignore the marketing department", "Outsource all IT work forever", "A matrix structure and an ERP with one database"], 3, "Matrix: сотрудник подчиняется и отделу, и IS-менеджменту. ERP даёт одну базу. Так совмещают контроль и скорость."], ["You open Gmail in a browser and simply use it. Which cloud service model is this?", ["SaaS", "PaaS", "On-premise", "IaaS"], 0, "SaaS: готовое приложение, вы просто пользователь. PaaS: инструменты для разработчика. IaaS: арендованные серверы."], ["A Blu-ray movie takes 25 GB. Facebook generates 4 PB of data every day. About how many movies equal one day of Facebook data?", ["About 1,600,000", "About 16,000", "About 160", "About 160,000"], 3, "4 PB = 4 000 000 GB (PB→TB→GB, ×1000×1000). 4 000 000 / 25 = 160 000. Сначала переводим в одну единицу."], ["In 2017 Equifax was attacked through a known weakness in Apache Struts. A fix already existed, but it was not installed. Which defense would have prevented this?", ["Patch management", "User training against phishing", "Multi-factor authentication", "Backup"], 0, "Патч — маленькое исправление от разработчика. Он был, но его не установили вовремя."]], "2": [["Dell stopped using the logistics and manufacturing modules of a packaged ERP. Why?", ["The modules were too expensive to buy", "ERP cannot be used by computer makers", "It would adopt the same practices as competitors and lose its unique supply chain", "Dell did not have any supply chain"], 2, "Правило: не превращай уникальный процесс в стандартный. Apple конкурирует продуктом, поэтому стандартный ERP ей не мешает."], ["Two processors are compared: one has a faster clock, the other a slower clock but more cores. According to the book, which factors increase CPU power?", ["Only clock speed", "Only the number of cores", "Only the size of the screen", "Both clock speed and the number of cores"], 3, "Больше тактов в секунду + несколько ядер делят нагрузку → больше мощности. Смотрите на несколько показателей."], ["Which four tests must a resource pass to give a lasting competitive advantage?", ["Digital, cloud-based, mobile, automated", "Valuable, rare, tough to imitate, no substitutes", "Cheap, fast, popular, new", "Large, global, profitable, public"], 1, "Resource-based view: нужны все четыре характеристики. Технологию легко скопировать, поэтому сама по себе она редко даёт долгое преимущество."], ["A senior manager uses an interactive tool to make a short-term decision. Which type of information system is this?", ["MIS (Management Information System)", "EIS (Executive Information System)", "DSS (Decision Support System)", "TPS (Transaction Processing System)"], 2, "DSS: интерактивный инструмент для краткосрочных решений старших менеджеров. EIS — стратегия топов, MIS — регулярные отчёты."], ["According to the lecture, what is the difference between Linux and Microsoft Windows?", ["Linux is open source; a Windows license must be purchased", "Linux is application software; Windows is an OS", "Only Windows manages memory and hardware", "Windows is open source; Linux must be purchased"], 0, "Оба — операционные системы. Linux — open source, Windows — проприетарная, лицензию покупают."], ["Which statement about IT and IS is correct?", ["IS is only the theory of computing", "IT and IS mean exactly the same thing", "IT is one component inside an IS", "An IS is one component inside IT"], 2, "IT: железо, ПО, сети. IS = IT + данные + люди + процессы + цель. CS — теория вычислений."], ["An experienced nurse can «feel» that a patient is getting worse but cannot easily explain how. Which kind of knowledge is this?", ["Information", "Explicit knowledge", "Raw data", "Tacit knowledge"], 3, "Tacit: интуиция и опыт, трудно передать словами. Explicit: можно записать словами или числами."], ["When does the lecture say outsourcing makes sense?", ["When the company plans to use the skill forever", "When the company wants full control over every system", "When the IT department already has every skill", "When a skill is not available inside the team and is needed for a limited time"], 3, "Outsourcing покупает навык на ограниченное время — это дешевле найма или обучения."], ["For most companies only about one third of their data is used for decisions. What is the most likely reason?", ["Nobody can find or trust the other data", "Laws forbid using more data", "The other data are worthless", "Computers are too slow to read it"], 0, "Данные, которые нельзя найти или которым нельзя доверять, не используются. Решение — governance и quality."], ["A shop buys five new card readers with a USB-C plug, but its old tablets have only micro-USB ports. What is the best action?", ["Test one reader with one tablet before buying five", "Buy all five; they will fit anyway", "Wait for the tablets to update their ports", "Throw away all tablets at once"], 0, "Порты физически не совпадают. Адаптер — ещё одна точка отказа, новые планшеты — большие траты. Сначала проверить совместимость."], ["An app gives a basic service for free, and some users pay for extra features. Which digital business model is this?", ["Advertising", "Affiliate", "Crowdfunding", "Freemium"], 3, "Freemium: бесплатная база + платный премиум (LinkedIn, Dropbox). IT-стратегия: аналитикой находить кандидатов на апгрейд."], ["What does Moore's Law say?", ["Computing power doubles about every two years at the same price", "Prices of computers double every two years", "Storage size stays the same every year", "GPU performance doubles every month"], 0, "Гордон Мур (Intel). Закон Хуанга (Nvidia): производительность GPU растёт больше чем вдвое каждый год."], ["An antivirus program is free for a 30-day trial, and after that you must pay to keep using it. Which license type is this?", ["Freemium", "Freeware", "Open-source license", "Shareware"], 3, "Shareware: сначала пробный период, потом оплата. Freeware: бесплатно, но код закрыт (Zoom basic). Freemium: база бесплатно, доп. функции платно."], ["A manager takes last month's sales data out of the database to build a report. Which of the five operations is this?", ["Process", "Retrieve", "Capture", "Disseminate"], 1, "Capture → Process → Store → Retrieve (достать из хранилища) → Disseminate (поделиться отчётом)."], ["Hospitals want to analyze data without moving it to a central repository, for better security and privacy. Which approach is this?", ["Data fabric", "Federated analytics", "Data mesh", "Master data management"], 1, "Federated analytics: анализ без перемещения данных. Data mesh: данными владеют доменные эксперты. Data fabric: демократизация данных."], ["A netbook is much lighter than a traditional laptop of the same size. What is the main reason?", ["It has only a smaller keyboard", "It has no hard drive and depends on the cloud and Wi-Fi", "It has no operating system", "It has no processor"], 1, "Нет жёсткого диска → легко, но данные и приложения в облаке, нужен Wi-Fi. У каждого дизайна есть компромисс."], ["A new accounting student says: «I chose accounting because it is about numbers, not computers.» Why is this plan risky?", ["Accounting no longer uses numbers", "All numbers are kept by IS, and audit reliability depends on that technology", "Accountants are not allowed to use computers", "Only large firms keep financial records"], 1, "Надёжность аудита = надёжность IS. Ошибочные цифры ведут к штрафам. Любая профессия связана с IS."], ["The Starbucks app stores customer preferences and rewards. What does this create for the customer?", ["A commodity product", "Switching costs: the customer loses something by leaving", "Lower prices than all rivals", "A barrier for suppliers"], 1, "Switching cost — что клиент теряет при уходе (бонусы, сохранённые заказы). Это удерживает клиентов."], ["In the restaurant metaphor for an API, what plays the role of the API?", ["The customer at the table", "The food", "The waiter", "The kitchen"], 2, "Вы (клиент) → официант (API) → кухня (система с данными). Меню — список разрешённых запросов. В кухню вы не заходите."], ["A customer posts a photo of her latte with the sentence «the best coffee in town». The shop also records 120 lattes sold this month. How do we classify these data?", ["Photo and sentence are qualitative; 120 is quantitative", "All three are quantitative", "The photo is quantitative; 120 is qualitative", "All three are qualitative"], 0, "Quantitative — числа. Qualitative — нечисловое: имена, фото, мнения, описания."], ["On 19 July 2024 a faulty security update crashed about 8.5 million Windows computers. Why was the damage so large?", ["Application software cannot cause crashes", "It was only a bug in a music app", "It affected only one home user", "The update worked at the system level, deep inside the computer"], 3, "System software работает глубоко, на нём держится всё. Ошибка там останавливает авиакомпании, банки и больницы."], ["A company makes all staff change their passwords every 90 days. Which kind of control is this?", ["Feedback", "Application control", "Output control", "General control"], 3, "General control — процесс использования системы, человеческие привычки. Application control встроен в ПО (firewall, шифрование)."], ["A company has 1,000 customers, and 850 of them have a phone number recorded. What is the completeness of the phone field?", ["94%", "100%", "85%", "15%"], 2, "Completeness = заполненные / все × 100 = 850/1000 = 85%."], ["Hundreds of companies assemble nearly the same PCs and compete on price. How does Apple avoid this commoditization?", ["Differentiation: a unique product that is not built on the same open standards", "Ignoring what customers want", "Selling at the lowest price", "Copying competitors' products"], 0, "Commodity: одинаковые товары, решает цена, минимальная маржа. Дифференциация выводит из ценовой войны."], ["A company buys laptops that staff will carry every day. Which storage device is the better fit?", ["SSD: lighter and more durable, but a bit more expensive", "No difference between them", "Hard disk: it is lighter and faster", "Hard disk: it has moving parts that protect data"], 0, "SSD — flash-память без движущихся частей: легче, быстрее, прочнее. HDD дешевле. Можно сочетать: SSD для ОС, HDD для остального."], ["A hospital keeps patient files on its own private servers and uses a public cloud for its website. Which type of cloud is this?", ["Hybrid cloud", "Public cloud", "On-premise only", "Private cloud"], 0, "Hybrid — смесь: секретные данные в private, остальное в public cloud."], ["AlmaPay finds 60,000 wrong phone numbers. IT says «it is business data», marketing says «IT stores it», and nobody fixes it. What is missing?", ["A faster server", "A clear owner of the data", "More storage space", "A new mobile app"], 1, "Governance даёт каждому набору данных владельца. Без владельца проблема остаётся, клиенты недоступны."], ["Researchers left 297 USB drives on a university campus. About what share did people plug in, and what is the lesson?", ["About 5%; people are naturally careful", "About 20%; USB drives are always safe", "45% or more; never plug in an unknown drive", "None; nobody touches unknown drives"], 2, "45–98% подключили, первую — за 6 минут. Флешка может содержать вредонос. Неизвестное устройство — отдать IT."], ["How many bits make one byte, and what does one byte represent?", ["2 bits; one pixel on the screen", "8 bits; about one character typed on a keyboard", "64 bits; one page of text", "1,000 bits; one digital photo"], 1, "Bit = binary digit (0/1). 8 бит = 1 байт = один символ. Kilobyte ≈ одна страница, megabyte ≈ одно фото."], ["A developer rents a virtual server and installs any OS and software she wants. Which cloud model is this?", ["SaaS", "On-premise", "IaaS", "PaaS"], 2, "IaaS: провайдер даёт серверы, хранилище, сеть; вы отвечаете за ОС, ПО и данные. Пицца: готовое тесто, печёте дома."]], "3": [["According to the 1-10-100 rule, where is it cheapest to deal with a data error?", ["Prevent it at entry", "Correct it later", "Let it reach the customer", "It costs the same everywhere"], 0, "Предотвратить — 1, исправить позже — 10, ошибка дошла до клиента — 100."], ["Domino's spends a lot of money on technology. How should it measure whether the investment paid off?", ["By how many computers it owns", "By the improvement in delivery times, a KPI linked to customer satisfaction", "By the size of its IT department", "By how many apps it has"], 1, "Ценность = измеримое улучшение результата, а не количество машин."], ["Who finds business needs and imagines a new or redesigned computer-based system?", ["Help desk / IT support", "Programmer", "Systems analyst", "Database administrator"], 2, "Analyst придумывает, programmer пишет код по его дизайну, DBA управляет БД, help desk — первая линия поддержки."], ["Uber shows a map inside its app by asking Google Maps for it. What makes this possible?", ["An API", "A device driver", "An ERP module", "Firmware"], 0, "API — правила, по которым одно приложение безопасно просит у другого данные или действие. Компания подключает готовые сервисы."], ["A thermostat, a light bulb and a garage door can all be controlled from a smartphone app. Which concept is this?", ["Netbook computing", "Internet of Things (IoT)", "Commoditization", "3D printing"], 1, "IoT: обычные вещи подключены к сети и обмениваются данными без человека."], ["Which enterprise system remembers that a customer complained last week?", ["ERP Finance module", "BI (Business Intelligence)", "SCM (Supply Chain Management)", "CRM (Customer Relationship Management)"], 3, "CRM хранит все контакты с клиентом: звонки, заказы, жалобы. SCM отслеживает товар от поставщика до клиента."], ["Supply-chain systems let suppliers manage their own inventory of raw materials. Which value chain activity does this support?", ["Human resource management", "Inbound logistics", "Service", "Outbound logistics"], 1, "Inbound — приём сырья. Outbound — доставка продукта клиенту. Service — поддержка после продажи. HRM — вспомогательная деятельность."], ["You get an email: «Urgent! Your bank account is blocked. Send your password now.» The sender address looks strange. What is this?", ["Phishing, a kind of social engineering", "Ransomware", "A zero-day vulnerability", "A software patch"], 0, "Признаки фишинга: странный отправитель, срочность, подозрительная ссылка, просьба пароля. Защита — обучение пользователей и MFA."], ["Match the task to the input device: (1) turn a paper contract into editable text, (2) give a voice command, (3) join a video lesson.", ["1 webcam, 2 scanner, 3 microphone", "1 scanner, 2 microphone, 3 webcam", "1 printer, 2 speakers, 3 projector", "1 microphone, 2 webcam, 3 scanner"], 1, "Scanner — документы как изображение или текст, microphone — звук и голос, webcam — видео."], ["What does the bus on a motherboard do?", ["It stores data permanently", "It cools the processor", "It shows the picture on the screen", "It is the electrical connection that moves data between CPU, memory and storage"], 3, "Скорость шины = скорость передачи × сколько бит за раз. Шина определяет, насколько свободно части общаются."], ["A company switches its new ERP on one department at a time. Which approach is this?", ["Big Bang: fast but risky", "Custom-made ERP", "Phased: slower but safer", "Outsourcing"], 2, "Big Bang — вся компания в один день (Hershey 1999). Phased — по отделам, медленнее, но безопаснее."], ["Lululemon uses CRM data on each customer experience to serve a smaller market very well. Which strategy is this?", ["Stuck in the middle", "Cost leadership", "Innovation", "Focus"], 3, "Focus — обслуживать узкий рынок очень хорошо."], ["A village app lets older people report symptoms and get remote health care. Which set of parts makes up the whole information system?", ["Technology, data, people and process", "Only the mobile phone and the app", "Only the hardware and the network", "Only the researchers who created it"], 0, "Приложение — лишь часть системы. Нужны технология, данные (симптомы), люди (жители, исследователи) и процесс (сообщить → оценка → помощь)."], ["Which list puts the storage prefixes in the correct order from smallest to largest?", ["Kilo, giga, mega, peta, tera", "Giga, mega, kilo, tera, peta", "Kilo, mega, giga, tera, peta", "Mega, kilo, giga, peta, tera"], 2, "Каждая ступень примерно ×1000. Страница ≈ KB, фото ≈ MB, Blu-ray 25 GB, Библиотека Конгресса 20 TB, Facebook 4 PB в день."], ["Data are owned by the domain experts who create them and shared by self-service. What is this approach called?", ["Data mesh", "Data warehouse", "Data fabric", "Federated analytics"], 0, "Data mesh — владение у доменных экспертов. Data fabric — доступ для большего числа людей. Federated — анализ без перемещения."], ["Physical location, network capabilities and the skills of the users belong to which element of an IS?", ["Control", "Environment", "Input", "Output"], 1, "Environment — где живёт система: здание, сеть, кто пользователи. Систему строят под место и людей."], ["Where does the IT function usually sit in a company today, according to the lecture?", ["A CIO or CTO leads IT and reports to the CEO", "Inside the accounting department as data processing", "Only with outside companies", "Under the CFO as a small team"], 0, "Эволюция: data processing в финансах → отдел под CFO → IT-департамент (80–90-е) → сегодня CIO/CTO подчиняется CEO."], ["Executives set five-year goals for the company. According to the Anthony framework, what data do they need?", ["Only raw sensor data", "Data from one cash register", "Aggregated data, less time sensitive", "Detailed, time-sensitive transaction data"], 2, "Operational: детальные и срочные. Management: сводные. Strategic: агрегированные, наименее срочные."], ["A processor runs at 3 GHz. What does one gigahertz mean?", ["One million cycles per second", "One billion cycles per second", "One thousand cycles per second", "One billion bytes of memory"], 1, "Hz — 1 цикл/с, kHz — тысяча, MHz — миллион, GHz — миллиард."], ["Why is technology alone rarely a lasting competitive advantage?", ["It is always too expensive to buy", "Laws forbid using the same technology", "It is easy to buy and copy, so rivals can match operational effectiveness", "Customers never notice technology"], 2, "Operational effectiveness (делать то же лучше) легко повторить. Strategic positioning (делать по-другому) скопировать трудно."], ["A policy that is widely used in an industry to promote efficiency, quality and compatibility between organizations is called a…", ["Business model", "Industry standard", "Sprint", "Framework"], 1, "Framework — набор руководств и практик для работы (Agile, COBIT). Standard — общепринятое требование для совместимости."], ["What is a cache in a CPU?", ["A small memory that keeps frequently used data close to the CPU", "A port for connecting a keyboard", "A cooling system for the motherboard", "A long-term storage device with platters"], 0, "Cache ускоряет CPU: нужные данные лежат рядом, не надо каждый раз идти в RAM."], ["A company replaces an old laptop and sends it for recycling. What must it do first?", ["Buy a Bluetooth chip", "Upgrade the RAM", "Install a new operating system", "Wipe the data"], 3, "Жизненный цикл: buy → use → maintain → replace → recycle. Перед выбросом — стереть данные."], ["A data team finds the same customer stored in different places and links the records. Which data quality activity is this?", ["Validating", "Monitoring", "Cleansing", "Matching"], 3, "Validate — проверка по правилам, Cleanse — исправить ошибки, Match — найти одно и то же в разных местах, Monitor — метрики во времени."], ["A team builds software for an airplane control system, where mistakes are very costly and rules are fixed. Which method fits best?", ["No plan at all", "MVP released after one sprint", "Agile with weekly changes", "Waterfall"], 3, "Waterfall — каждый шаг до конца, хорошая документация. Подходит для банков, авиации, медтехники. Agile — для стартапов и приложений."], ["A barista records a customer's order on the point-of-sale (POS) system. Which type of information system is this?", ["EIS (Executive Information System)", "TPS (Transaction Processing System)", "DSS (Decision Support System)", "MIS (Management Information System)"], 1, "TPS обслуживает ежедневные транзакции frontline-сотрудников."], ["Why is much e-waste sent to China, South Asia or sub-Saharan Africa?", ["Because these countries make all phones", "Because e-waste has no toxic materials", "Because it is cheaper to send it there", "Because recycling there is simple and safe"], 2, "Переработка сложна: длинная цепочка, разные законы, «прибыль выше принципов». Отправить за границу дешевле."], ["What is the main advantage of one centralized IT department?", ["Quicker turnaround for every department", "Data stored in many places", "Maximum control over computing resources", "No need for any procedures"], 2, "Централизация: максимум контроля, но медленнее для отделов. Децентрализация: быстрее, но дублирование и данные в разных местах."], ["A debit card purchase charges your account automatically. Which element of the IS is this an example of?", ["Input", "Environment", "Feedback", "Output"], 0, "Input — данные, введённые пользователями или автоматически. Output — отчёты о продажах и прибыли."], ["Sales sells 10 laptops, but the warehouse does not know and sells the same laptops to another customer. What solves this problem of information silos?", ["More printers in the warehouse", "A new operating system", "A separate app for every department", "An ERP: one system with one shared database"], 3, "Silo — отдел держит данные у себя. ERP: ввёл один раз — все отделы видят сразу."]]};
let V=1,Q=VARS[1];
try{const s=+localStorage.getItem("bis-variant");if(VARS[s]){V=s;Q=VARS[s]}}catch(e){}
function setVar(n){V=n;Q=VARS[n];try{localStorage.setItem("bis-variant",n)}catch(e){}home()}
const L="ABCD",$=s=>document.querySelector(s);
let mode,i,ans,flag,done,warn=false;
const app=$("#app");
function home(){done=false;app.innerHTML=`<div class="card"><h1>🎓 Basics of Information Systems</h1><div class="mut">Midterm · Weeks 1–7 · Вариант ${V} · ${Q.length} вопросов</div>
<div class="row" style="margin-top:10px">${Object.keys(VARS).map(n=>`<button class="btn${n==V?" p":""}" onclick="setVar(${n})">Вариант ${n}</button>`).join("")}</div>
<button class="btn mode" onclick="start('practice')"><b>📘 Тренировка</b><span class="mut">Сразу видно верный ответ + объяснение с примером</span></button>
<button class="btn mode" onclick="start('exam')"><b>📝 Экзамен</b><span class="mut">Без подсказок, результат и разбор ошибок в конце</span></button></div>
<div class="card mut">Составлено по лекциям BIS Week 1–7 (Bourgeois, OpenStax). Три варианта с разными вопросами.</div>`}
function start(m){mode=m;i=0;done=false;warn=false;ans=Array(Q.length).fill(null);flag=Array(Q.length).fill(false);draw()}
function pick(k){if(mode=="practice"&&ans[i]!==null)return;ans[i]=k;warn=false;draw()}
function go(n){i=Math.max(0,Math.min(Q.length-1,n));warn=false;draw();scrollTo(0,0)}
function cls(n){let c="g";const a=ans[n];if(a!==null)c+=mode=="practice"?(a==Q[n][2]?" ok":" no"):" a";if(flag[n])c+=" f";if(n==i)c+=" cur";return c}
function draw(){
if(done)return result();
const q=Q[i],a=ans[i],pr=mode=="practice",shown=pr&&a!==null,cnt=ans.filter(x=>x!==null).length,left=Q.length-cnt;
app.innerHTML=`<div class="top"><b>Вопрос ${i+1} / ${Q.length}</b><span class="mut">${pr?"Тренировка":"Экзамен"} · отвечено ${cnt}</span></div>
<div class="bar"><i style="width:${cnt/Q.length*100}%"></i></div>
<div class="card"><h2>${q[0]}</h2>${q[1].map((o,k)=>{let c="opt";if(shown){if(k==q[2])c+=" ok";else if(k==a)c+=" no"}else if(k==a)c+=" sel";
return `<button class="${c}" onclick="pick(${k})"><span class="l">${L[k]}</span><span>${o}</span></button>`}).join("")}
${shown?`<div class="exp"><b>${a==q[2]?"✅ Верно!":"❌ Правильный ответ: "+L[q[2]]}</b><br>💡 ${q[3]}</div>`:""}
<div class="row"><button class="btn" onclick="go(i-1)" ${i?"":"disabled"}>←</button>
<button class="btn" onclick="flag[i]=!flag[i];draw()">${flag[i]?"🚩 Снять":"🏳️ Вернуться"}</button>
${i<Q.length-1?`<button class="btn p" onclick="go(i+1)">Далее →</button>`:`<button class="btn p" onclick="finish()">Завершить</button>`}</div></div>
<div class="card"><div class="grid">${Q.map((_,n)=>`<button class="${cls(n)}" onclick="go(${n})">${n+1}</button>`).join("")}</div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="finish()">${warn?"Да, завершить":"Завершить тест"}</button><button class="btn" onclick="home()">В меню</button></div>
${warn?`<div class="warn">Без ответа: ${left}. Нажмите «Да, завершить» ещё раз, чтобы закончить.</div>`:""}</div>`}
function finish(){const left=ans.filter(x=>x===null).length;if(left&&!warn){warn=true;draw();return}warn=false;done=true;result();scrollTo(0,0)}
function result(){
const ok=Q.filter((q,n)=>ans[n]==q[2]).length,p=Math.round(ok/Q.length*100),bad=Q.map((q,n)=>n).filter(n=>ans[n]!=Q[n][2]);
app.innerHTML=`<div class="card"><div class="score">${ok}/${Q.length}</div><p style="text-align:center;margin:0" class="mut">${p}% · ${p>=90?"Отлично! 🔥":p>=70?"Хорошо 👍":p>=50?"Надо повторить 📚":"Нужна подготовка 💪"}</p>
<div class="row" style="margin-top:14px"><button class="btn p" onclick="start(mode)">Заново</button><button class="btn" onclick="home()">В меню</button></div></div>
<div class="card"><b>Разбор ошибок (${bad.length})</b>${bad.length?bad.map(n=>{const q=Q[n],a=ans[n];return `<div class="rev"><b>${n+1}. ${q[0]}</b><br><span style="color:var(--no)">Ваш ответ: ${a===null?"нет ответа":L[a]+") "+q[1][a]}</span><br><span style="color:var(--ok)">Верно: ${L[q[2]]}) ${q[1][q[2]]}</span><br><span class="mut">💡 ${q[3]}</span></div>`}).join(""):"<p>Ошибок нет, всё верно! 🎉</p>"}</div>`}
home();
</script>

</body></html>
