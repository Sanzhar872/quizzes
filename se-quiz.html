// Variant 3
const Q3=[
["In the waterfall model, which phase comes directly after system and software design?",["Integration and system testing","Operation and maintenance","Requirements analysis and definition","Implementation and unit testing"],3,"Порядок: требования → дизайн → реализация и unit-тесты → интеграция → эксплуатация. Пример: схема БД готова, теперь пишем код."],
["Two developers write code together at one computer. One types and the other reviews each line. Which agile technique is this?",["Test-first development","Pair programming","Refactoring","Release testing"],1,"Один пишет (driver), второй проверяет (navigator). Пример: сложный модуль оплаты пишут вдвоём, чтобы поймать ошибки сразу."],
["A chemical plant system detects high pressure and opens a relief valve before an explosion. Which safety strategy is this?",["Hazard avoidance by design","Hazard assessment of risks","Hazard detection and removal","Damage limitation after an accident"],2,"Опасность обнаружена и устранена до аварии. Пример: датчик давления открывает клапан. Если бы клапан гасил последствия после взрыва, это была бы limitation."],
["A tool receives the goal «fix this bug», makes its own plan, runs terminal commands, checks the results and changes the plan when needed. What is it?",["An AI agent","A rule-based bot","A simple chat assistant that answers one question at a time","A code editor with syntax highlighting"],0,"Агент сам планирует, действует и корректирует план. Пример: Claude Code получает задачу, запускает тесты и правит код по результатам."],
["Why do architects use several architectural views (for example the 4+1 model)?",["One diagram can show only one view of the architecture","Views replace the need for requirements","Several diagrams always cost less than one diagram","A single diagram is always enough for every purpose"],0,"Одна диаграмма показывает один аспект. Пример: для разработчика нужна структура классов, для админа схема развёртывания на серверах."],
["A team builds software that must work with fixed hardware. Decisions about the software’s functionality cannot wait until late in the project. Which process model fits best?",["Informal development without a plan","Incremental development, with the specification changing in every cycle","Waterfall model, with complete specification before implementation","Building prototypes only, with no written specification"],2,"Если железо фиксировано, функции нужно определить заранее. Пример: прошивка для медицинского прибора."],
["A team checks that the finished software really does what the customer wants. Which fundamental activity is this?",["Software development","Software specification","Software validation","Software evolution"],2,"Validation: «делаем ли мы нужный продукт?». Verification: «делаем ли мы продукт правильно?». Пример: показали готовое приложение заказчику."],
["Which sentence best describes software engineering?",["The activity of writing program code only","An engineering discipline that covers all parts of software production, including maintenance","A method for designing computer hardware","The use of computers to store company data"],1,"SE это вся жизнь ПО: требования, дизайн, тесты, сопровождение, а не только кодинг."],
["Which statement about the boundary of a system is correct?",["It stays fixed and can never be changed later","It is decided by the developers without any discussion with stakeholders","Its position may depend on social and organizational concerns","It is always decided only by technical facts and tools"],2,"Границу системы часто определяют политика и организация. Пример: войдёт ли оплата общежития в систему бронирования, решает администрация."],
["In a Scrum sprint the team cannot finish two backlog items on time. What should happen?",["The items return to the product backlog, and the sprint stays fixed","The sprint is extended until the items are finished, and the plan is kept","The team skips the next sprint to catch up","The unfinished items are deleted from the project forever"],0,"Длина спринта фиксирована (time-box). Невыполненное возвращается в backlog и переоценивается."],
["Before design starts, a team reviews the requirements. It finds that two of them contradict each other, and that one is not what the customer really wants. Which activity is this?",["Requirements validation","Release testing","Requirements specification","Requirements elicitation"],0,"Validation проверяет требования на непротиворечивость и реальность. Пример: два пункта ТЗ требуют разного поведения кнопки."],
["All 200 tests of a program pass. What can you correctly conclude?",["The program is free of defects and ready for every user","The program will never fail in real use","The tests found no defects, but defects may still exist","No more tests will be needed in the future"],2,"Тесты показывают наличие ошибок, но не их отсутствие (Дейкстра). 200 зелёных тестов не гарантируют идеальность."],
["Software must be written so that it can change when customer needs change. Which attribute of good software is this?",["Maintainability","Acceptability","Efficiency","Dependability and security"],0,"Maintainability: ПО легко менять. Пример: новое налоговое правило вносится без переписывания всей системы."],
["An engineer gives a client’s private business data to a competitor. Which ethical principle is broken?",["Intellectual property rights","Confidentiality","Computer misuse","Competence"],1,"Confidentiality: нельзя раскрывать данные клиента. IP касается авторских прав и лицензий."],
["What does a large language model (LLM) do at its core?",["It runs a fixed list of if/then rules written by developers","It searches the internet and copies the answer word by word","It compiles natural language directly into machine code","It predicts the next token using probabilities learned from large amounts of text"],3,"LLM предсказывает следующий токен по вероятностям. Поэтому она может звучать уверенно, но ошибаться."],
["Which pair should be modeled with inheritance in a class diagram?",["Booking and Room (a booking is a room)","Student and Booking (a student is a booking)","Room and Confirmation (a room is a confirmation)","Administrator and User (an administrator is a user)"],3,"Наследование это связь «is-a». Administrator is a User. Booking и Room связаны ассоциацией («has»), а не наследованием."],
["A developer writes a failing test first, then writes code to make it pass, then cleans the code. Which cycle is this?",["Alpha-Beta release cycle with outside users","Red-Green-Refactor in test-driven development","Waterfall testing after all coding is done","Black-box release testing by a separate team"],1,"Red (тест падает) → Green (код проходит) → Refactor (чистим). Пример: сначала тест для расчёта скидки."],
["A developer asks an LLM to write code, and the code calls a library function that does not exist. Which limitation is this?",["High cost of each request","Hallucination","Limit of the context window","Latency of the response"],1,"Hallucination: модель уверенно выдумывает несуществующее. Поэтому код от LLM нужно запускать и проверять."],
["A bank wants a measure of how likely its app is to deliver correct results over a whole month. Which property is this?",["Security","Availability","Safety","Reliability"],3,"Reliability: вероятность корректной работы за период. Availability: доступна ли система в момент запроса."],
["A company writes a word processor and sells it to many different customers. What kind of product is this?",["An embedded control system","A batch processing system","A generic product","A customized product"],2,"Generic: пишется для рынка, спецификацию задаёт разработчик. Customized: под конкретного заказчика (Word против ПО для одного банка)."],
["What does the lecture say about the maintenance cost of a system with a long life?",["It may be several times the development cost","It is always smaller than the development cost","It is always zero after the first release","It does not depend on the age of the system"],0,"У долгоживущих систем сопровождение дороже разработки в несколько раз. Пример: банковские системы живут десятилетиями."],
["A sequence diagram for Book room must show a successful confirmation and an alternative when the room is unavailable. Which element is used?",["A use case for each outcome","An alt fragment with guards","A new class for each outcome","A package diagram"],1,"В sequence diagram ветвление делается через alt-фрагмент с условиями [room free] / [room taken]."],
["A developer pastes a very large codebase into an LLM and the model ignores code from the beginning. Which limitation is the most likely cause?",["High cost per token","The model has no training data","The context window limit","Hallucination of a library"],2,"Context window ограничен: начало вытесняется или теряется. Решение: давать только нужные файлы."],
["A small company builds a business app. The team can talk with the customer every day, and the requirements change quickly. Which approach is usually better?",["Waterfall, because it avoids later changes","Incremental development or agile methods","Formal development with mathematical proofs","A complete specification before any coding"],1,"Agile подходит при быстро меняющихся требованиях и близком клиенте."],
["In an activity diagram for Book room, the check «room blocked?» has two outcomes. How should it be drawn?",["As two final nodes without any labels on the arrows","As a fork with two parallel paths that run at the same time","As a lifeline that sends a self-message to the database","As a decision with labeled guards such as [blocked] and [not blocked]"],3,"Выбор одного пути это decision (ромб) с guard-условиями. Fork означает параллельность, а тут выполняется только одна ветка."],
["Two stakeholders want conflicting features, and the team must agree what to build first. Which stage of elicitation is this?",["Requirements prioritization and negotiation","Requirements discovery","Requirements validation","Requirements specification"],0,"Конфликт интересов решается через приоритизацию и переговоры. Пример: деканат хочет отчёты, студенты хотят мобильное приложение, что делаем первым?"],
["A company studies its existing process and changes it to raise product quality and reduce time and cost. What is this called?",["Requirements validation","Pair programming","Release testing","Process improvement"],3,"Process improvement: анализ и улучшение самого процесса разработки (например, добавили code review и автотесты)."],
["After the requirements document is approved, the customer asks for a new feature. What must change management decide?",["Whether the customer is an official stakeholder","Whether the old requirements used natural language only","Whether the developers personally like the feature","Whether the benefits of the change justify its cost"],3,"Change management оценивает стоимость и пользу изменения. Не «нравится ли», а «стоит ли оно того»."],
["Which acceptance criterion is the best for a room booking system?",["The system should be fast, friendly and easy to use for every student","Given a free 90-minute slot in the future, when the student confirms, then the booking is saved and a confirmation is shown","The database stores each booking in a table named bookings with an ID column","The booking should work well and look nice for all students at all times"],1,"Хороший критерий проверяем: Given-When-Then. Слова «быстро, удобно, красиво» непроверяемы, а таблица БД это деталь реализации."],
["A document describes in detail the functions, services and operating constraints of a system. It is written for the developers who will design it. What is it?",["System requirements","A feasibility study","A user manual","User requirements"],0,"System requirements: детальные, для разработчиков. User requirements: общие, на языке заказчика."],
["A model is trained on many curated pairs of a prompt and a good response, so it learns to follow instructions. Which training stage is this?",["Supervised fine-tuning","Code compilation","Self-supervised pretraining","Preference tuning"],0,"SFT: обучение на размеченных парах «запрос → хороший ответ». Pretraining идёт на сыром тексте, preference tuning на сравнении ответов."],
["A system will be built by a separate company through outsourcing. What does the lecture say about its specification?",["It should contain only a list of screens","It must be detailed and precise","It can be very short, like an in-house iterative project","It is not needed if the customer is friendly"],1,"Подрядчик не сидит рядом, поэтому спецификация должна быть точной, иначе спор о том, что заказывали."],
["In an object-oriented design, an object keeps its own state, and other objects can use that state only through operations. What is the benefit?",["The object can be understood and changed as a stand-alone entity","The object does not need any operations to be used","All objects can change each other’s data directly without limits","The state is visible to every part of the whole program"],0,"Инкапсуляция: внутренности можно менять, не ломая остальной код (пока интерфейс тот же)."],
["A vending machine has a finite number of states and moves from one state to another when a coin is inserted or a button is pressed. Which kind of model is this?",["Data-driven model","Structural model","Context model","Event-driven model"],3,"Event-driven: система реагирует на события (монета, кнопка), моделируется диаграммой состояний."],
["A student wants to open an online learning system at any time of the day and find it up and running. Which dependability property matters most?",["Security","Safety","Resilience","Availability"],3,"Availability: система доступна в момент обращения. Пример: ночь перед дедлайном, сайт обязан работать."],
["Which is a well-formed user story?",["The system uses a relational database to keep all the bookings","Build a cancel button on the booking page of the interface","As a student, I want to cancel my own booking so that another student can use the room","As an administrator, I want everything to work well and without any problems"],2,"Формат: «Как [роль], я хочу [действие], чтобы [польза]». Остальные варианты описывают реализацию или слишком размыты."],
["In a use case diagram of a room booking system, where should the actors Student and Administrator be drawn?",["Inside the boundary, as use cases","Under each use case, as attributes","Inside the boundary, next to the database","Outside the system boundary"],3,"Акторы внешние, их рисуют вне прямоугольника системы. Внутри только use cases."],
["You must model (a) the interaction between the system and its external users, and (b) the interaction between components inside the system. Which pair of models fits?",["(a) class diagram, (b) class diagram","(a) use case model, (b) sequence diagram","(a) sequence diagram, (b) use case model","(a) state diagram, (b) state diagram"],1,"Use case: пользователи ↔ система. Sequence: обмен сообщениями между внутренними компонентами."],
["A legacy system has low quality but high business value. What does the lecture suggest?",["Keep normal maintenance only and do nothing else","Ignore it because its quality is low","Re-engineer, or replace it if a suitable system exists or is planned","Scrap it immediately without any replacement or plan"],2,"Ценное, но плохое ПО реинжинирят или заменяют по плану. Выбросить без замены нельзя: бизнес на нём работает."],
["Performance and security are the most important needs of a system. What should the choice of architectural style depend on most?",["The color scheme chosen for the user interface","The favorite style of the team leader","The non-functional requirements of the system","The number of developers who work in the team"],2,"Архитектуру определяют нефункциональные требования (скорость, безопасность, надёжность)."],
["A critical control system for an aircraft is built by several teams in different countries and will be maintained for many years. Which approach is the best fit?",["Agile with a single developer who needs no planning","Plan-driven, because the planning overhead is justified here","Agile with no documents, because the teams can talk informally","No formal process, because the system is too large"],1,"Критичная, большая, распределённая и долгоживущая система требует плана и документации."],
["A hospital system must stop attackers and unauthorized staff from reading patient records. Which dependability property is the most important here?",["Availability","Security","Resilience","Reliability"],1,"Security: защита от несанкционированного доступа. Пример: врач видит только карты своих пациентов."],
["Why should the interfaces between objects or subsystems be specified early in design?",["So that the final code is always shorter","So that testing is not needed later in the project","So that the objects and subsystems can be designed in parallel","So that the customer can no longer change requirements"],2,"Зная интерфейс, команды работают параллельно. Пример: фронтенд и бэкенд договорились об API и пишут одновременно."],
["An analyst spends a week watching how clerks handle requests, to understand the real work before defining the system. Which technique is this?",["Ethnography","Interviewing","Use case modeling","Prototyping"],0,"Этнография: наблюдение за реальной работой, она показывает то, о чём люди не рассказывают в интервью."],
["A system runs three copies of the same software on identical hardware. What is the main weakness?",["A common design fault can make all copies fail the same way","Redundancy is impossible to use for software","Three copies always cost less than one copy","The copies cannot be compared by any voting system"],0,"Одинаковые копии имеют одну и ту же ошибку. Нужно разнообразие (diversity): разные команды и реализации."],
["A team wants to show the workflow of booking a room, with decisions, a success path and failure paths. Which UML diagram is the best choice?",["Class diagram","Deployment diagram","Activity diagram","Use case diagram"],2,"Activity diagram показывает поток работы с ветвлениями. Class это структура, Use case это функции для актора."],
["A team reuses a described way of organizing a system that has been tried and tested in many other systems. What are they using?",["A user story written on a story card","A single test case from the test plan","A legacy system with old hardware","An architectural pattern"],3,"Architectural pattern: проверенное решение. Пример: MVC в веб-приложениях, слоистая архитектура."],
["«The system must follow the national data protection law.» Which kind of non-functional requirement is this?",["External requirement","Organizational requirement","Functional requirement","Product requirement"],0,"External: идут извне (законы, стандарты, регуляторы). Organizational: политика самой компании."],
["Which description matches partition testing?",["Testing after the release, done by the customers in their offices","Grouping inputs the program should treat in the same way, and testing from each group","Testing every possible input one by one until nothing is left","Testing only the largest possible input that the program accepts"],1,"Equivalence partitioning: разбиваем входы на классы и берём по представителю. Пример: возраст на классы <0, 0–17, 18–120, >120."],
["Tests show the software meets every item of its specification, but customers say it is not what they need. What is the problem?",["Unit testing was skipped by the development team","Verification failed, because the code has syntax errors in many files","The tests were written but never executed","Validation failed: the software does not meet what customers expect"],3,"Verification пройдена (соответствует спецификации), а validation нет (спецификация не отражает нужды клиента)."]
];

const VARS={2:V2.map(q=>[q[0],q[1],q[2],Q3[q[3]][3]]),3:Q3};
let V=3,Q=Q3;
try{const s=+localStorage.getItem("se-variant");if(VARS[s]){V=s;Q=VARS[s]}}catch(e){}
function setVar(n){V=n;Q=VARS[n];try{localStorage.setItem("se-variant",n)}catch(e){}home()}
const L="ABCD",$=s=>document.querySelector(s);
let mode,i,ans,flag,done;
const app=$("#app");
function home(){done=false;app.innerHTML=`<div class="card"><h1>🎓 Software Engineering</h1><div class="mut">Midterm Exam · Variant ${V} · ${Q.length} вопросов</div>
<div class="row" style="margin-top:10px">${Object.keys(VARS).map(n=>`<button class="btn${n==V?" p":""}" onclick="setVar(${n})">Вариант ${n}</button>`).join("")}</div>
<button class="btn mode" onclick="start('practice')"><b>📘 Тренировка</b><span class="mut">Сразу видно верный ответ + объяснение с примером «где и зачем»</span></button>
<button class="btn mode" onclick="start('exam')"><b>📝 Экзамен</b><span class="mut">Без подсказок, результат и разбор ошибок в конце</span></button></div>
<div class="card mut">Ответы определены мной по курсу (Sommerville), сверьте с вашим ключом, если он есть.</div>`}
function start(m){mode=m;i=0;done=false;ans=Array(Q.length).fill(null);flag=Array(Q.length).fill(false);draw()}
function pick(k){if(mode=="practice"&&ans[i]!==null)return;ans[i]=k;draw()}
function go(n){i=Math.max(0,Math.min(Q.length-1,n));draw();scrollTo(0,0)}
function cls(n){let c="g";const a=ans[n];if(a!==null)c+=mode=="practice"?(a==Q[n][2]?" ok":" no"):" a";if(flag[n])c+=" f";if(n==i)c+=" cur";return c}
function draw(){
if(done)return result();
const q=Q[i],a=ans[i],pr=mode=="practice",shown=pr&&a!==null,cnt=ans.filter(x=>x!==null).length;
app.innerHTML=`<div class="top"><b>Вопрос ${i+1} / ${Q.length}</b><span class="mut">${pr?"Тренировка":"Экзамен"} · отвечено ${cnt}</span></div>
<div class="bar"><i style="width:${cnt/Q.length*100}%"></i></div>
<div class="card"><h2>${q[0]}</h2>${q[1].map((o,k)=>{let c="opt";if(shown){if(k==q[2])c+=" ok";else if(k==a)c+=" no"}else if(k==a)c+=" sel";
return `<button class="${c}" onclick="pick(${k})"><span class="l">${L[k]}</span><span>${o}</span></button>`}).join("")}
${shown?`<div class="exp"><b>${a==q[2]?"✅ Верно!":"❌ Правильный ответ: "+L[q[2]]}</b><br>💡 ${q[3]}</div>`:""}
<div class="row"><button class="btn" onclick="go(i-1)" ${i?"":"disabled"}>←</button>
<button class="btn" onclick="flag[i]=!flag[i];draw()">${flag[i]?"🚩 Снять":"🏳️ Вернуться"}</button>
${i<Q.length-1?`<button class="btn p" onclick="go(i+1)">Далее →</button>`:`<button class="btn p" onclick="finish()">Завершить</button>`}</div></div>
<div class="card"><div class="grid">${Q.map((_,n)=>`<button class="${cls(n)}" onclick="go(${n})">${n+1}</button>`).join("")}</div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="finish()">Завершить тест</button><button class="btn" onclick="if(confirm('Выйти в меню?'))home()">В меню</button></div></div>`}
function finish(){const left=ans.filter(x=>x===null).length;if(left&&!confirm("Без ответа: "+left+". Завершить?"))return;done=true;result();scrollTo(0,0)}
function result(){
const ok=Q.filter((q,n)=>ans[n]==q[2]).length,p=Math.round(ok/Q.length*100),bad=Q.map((q,n)=>n).filter(n=>ans[n]!=Q[n][2]);
app.innerHTML=`<div class="card"><div class="score">${ok}/${Q.length}</div><p style="text-align:center;margin:0" class="mut">${p}% · ${p>=90?"Отлично! 🔥":p>=70?"Хорошо 👍":p>=50?"Надо повторить 📚":"Нужна подготовка 💪"}</p>
<div class="row" style="margin-top:14px"><button class="btn p" onclick="start(mode)">Заново</button><button class="btn" onclick="home()">В меню</button></div></div>
<div class="card"><b>Разбор ошибок (${bad.length})</b>${bad.length?bad.map(n=>{const q=Q[n],a=ans[n];return `<div class="rev"><b>${n+1}. ${q[0]}</b><br><span style="color:var(--no)">Ваш ответ: ${a===null?"нет ответа":L[a]+") "+q[1][a]}</span><br><span style="color:var(--ok)">Верно: ${L[q[2]]}) ${q[1][q[2]]}</span><br><span class="mut">💡 ${q[3]}</span></div>`}).join(""):"<p>Ошибок нет, всё верно! 🎉</p>"}</div>`}
home();
</script></body></html>
