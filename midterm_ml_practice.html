<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midterm Practice ML</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1a1d24;--mut:#5b6270;--bd:#cfd4de;--acc:#2563eb;--hov:#eef3ff;--ok:#1d4ed8;--okbg:#dde8ff;--bad:#b45309;--badbg:#ffecd2;--code:#eef0f5}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d25;--tx:#e8eaf0;--mut:#9aa1b0;--bd:#2f3441;--acc:#60a5fa;--hov:#222838;--ok:#93c5fd;--okbg:#1b3358;--bad:#fdba74;--badbg:#45290f;--code:#242833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0}
.stats{color:var(--mut);font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .2s}
.tabs,.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px}
button:hover{background:var(--hov)}
button.primary,.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.tab.on::before{content:"● "}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:20px}
.qn{color:var(--mut);font-size:14px;margin-bottom:6px}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:0 6px;margin-left:6px;font-size:12px}
.q{font-size:18px;font-weight:600;margin-bottom:12px;white-space:pre-wrap}
pre{background:var(--code);border-radius:10px;padding:12px;overflow-x:auto;font:15px/1.45 ui-monospace,Consolas,monospace;margin:0 0 14px}
.blank{background:var(--acc);color:#fff;border-radius:4px;padding:0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px;padding:12px}
.key{flex:none;min-width:26px;height:26px;border-radius:7px;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.ok{background:var(--okbg);border:2.5px solid var(--ok)}
.opt.bad{background:var(--badbg);border:2.5px dashed var(--bad)}
.opt .mark{margin-left:auto;font-weight:700;white-space:nowrap}
.opt.ok .mark{color:var(--ok)} .opt.bad .mark{color:var(--bad)}
input[type=text]{width:100%;font:17px ui-monospace,Consolas,monospace;padding:12px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
input.ok{border:2.5px solid var(--ok);background:var(--okbg)}
input.bad{border:2.5px dashed var(--bad);background:var(--badbg)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--okbg);border-left:6px solid var(--ok)}
.fb.bad{display:block;background:var(--badbg);border-left:6px double var(--bad)}
.fb b{display:block;margin-bottom:4px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{width:38px;height:34px;padding:0;font-size:13px;border-radius:8px}
.dot.cur{outline:3px solid var(--acc);outline-offset:1px}
.dot.ok{background:var(--okbg);border:2px solid var(--ok)}
.dot.bad{background:var(--badbg);border:2px dashed var(--bad)}
.hint{color:var(--mut);font-size:13px;margin-top:12px}
.wrong{border-top:1px solid var(--bd);padding:10px 0}
.wrong .a{color:var(--ok);font-weight:600}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Midterm Practice · Intro ML</h1><div class="stats" id="stats"></div></header>
  <div class="tabs" id="tabs"></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="tools">
    <button id="shuf">🔀 Перемешать</button>
    <button id="onlyBad">✗ Только ошибки</button>
    <button id="reset">↺ Сначала</button>
    <button id="finish">🏁 Итог</button>
  </div>
  <div class="card" id="card"></div>
  <div class="dots" id="dots"></div>
  <div class="hint">Клавиши: <code>1–5</code> выбрать · <code>Enter</code> проверить / далее · <code>←</code> <code>→</code>. Fill-in чувствителен к регистру; точка в начале и <code>()</code> в конце игнорируются. Метки: <b>U1</b> — Unit 1, <b>LA</b> — Linear Algebra, <b>Code</b> — pandas/sklearn.</div>
</div>

<script>
const TF=['True','False'];
const V={
'Вариант A':[
{s:'U1',t:'mc',q:'Instance-based learning builds a mathematical model from the data and stores only the model.',o:TF,a:1,e:'Это model-based. Instance-based хранит весь датасет и сравнивает новые точки с сохранёнными.'},
{s:'U1',t:'mc',q:'Detecting tumors in brain scans (exact location and shape) is an example of:',o:['Image classification','Semantic image segmentation','Clustering','Regression'],a:1,e:'Классифицируется каждый пиксель → semantic segmentation.'},
{s:'U1',t:'mc',q:'In batch learning, after training the model is fixed; if new data comes, you must retrain with the whole dataset.',o:TF,a:0,e:'Batch (offline) learning — модель фиксирована, новые данные → переобучение с нуля.'},
{s:'Code',t:'fill',q:'Get the number of samples and features of the iris data.',code:"iris['data'].____",a:['shape'],e:'.shape → (150, 4): samples × features.'},
{s:'U1',t:'mc',q:'A hyperparameter is:',o:['A parameter of the model learned during training','A parameter of the learning algorithm, set before training','The bias term of a linear model','The accuracy on the test set'],a:1,e:'Гиперпараметр — параметр алгоритма (не модели), задаётся до обучения: k в kNN, learning rate, глубина дерева.'},
{s:'LA',t:'fill',q:'Compute the dot product of vectors v and w.',code:"result = np.____(v, w)",a:['dot'],e:'np.dot(v, w) = Σ vᵢwᵢ.'},
{s:'LA',t:'mc',q:'In linear algebra, it is possible to add a vector in ℝ³ to a vector in ℝ⁵.',o:TF,a:1,e:'Сложение определено только для одинаковой размерности.'},
{s:'LA',t:'mc',q:'If matrix A has shape (4, 3), what is the shape of A.T?',o:['(4, 3)','(3, 4)','(12,)','(1, 12)'],a:1,e:'Транспонирование меняет строки и столбцы местами.'},
{s:'Code',t:'fill',q:'Train the k nearest neighbors classifier on the training set.',code:"knn = KNeighborsClassifier(n_neighbors=1)\nknn.____(X_train, y_train)",a:['fit'],e:'fit() обучает модель.'},
{s:'U1',t:'mc',q:'Segmenting clients based on their purchases to design a marketing strategy for each segment is:',o:['Classification','Regression','Clustering','Reinforcement learning'],a:2,e:'Группировка без меток → clustering (k-means, DBSCAN).'},
{s:'U1',t:'mc',q:'Semi-supervised learning uses a small amount of labeled data and a large amount of unlabeled data.',o:TF,a:0,e:'«Learning with a little help» — мало меток, много неразмеченных.'},
{s:'U1',t:'mc',q:'Which is a solution to overfitting?',o:['Select a more powerful model with more parameters','Gather more training data','Reduce the regularization hyperparameter','Reduce the constraints on the model'],a:1,e:'Остальные три — решения underfitting.'},
{s:'LA',t:'fill',q:'Compute the Hadamard (element-wise) product of a and b in NumPy.',code:"h = a ____ b",a:['*'],e:'* — поэлементно, @ — матричное умножение.'},
{s:'LA',t:'mc',q:'The dot product of two orthogonal vectors is:',o:['Maximum positive','Negative','Zero','Equal to 1'],a:2,e:'θ = 90° → cos θ = 0 → dot = 0.'},
{s:'LA',t:'mc',q:'Any vector set that includes the zero vector is linearly dependent.',o:TF,a:0,e:'α·0 = 0 при α ≠ 0 — нетривиальное решение.'},
{s:'U1',t:'fill',q:'Mitchell: a program learns from experience E with respect to task T and performance measure ___ (one letter).',a:['P'],e:'E — experience, T — task, P — performance measure.'},
{s:'U1',t:'mc',q:'The ratio of correctly classified emails is a performance measure called:',o:['Precision','Accuracy','Cost function','Recall'],a:1,e:'Accuracy — доля верных предсказаний, часто в классификации.'},
{s:'Code',t:'fill',q:'Compute the test set accuracy using the knn object directly.',code:"knn.____(X_test, y_test)",a:['score'],e:'score() сразу считает accuracy.'},
{s:'U1',t:'mc',q:'The error rate on new cases is called:',o:['Training error','Generalization error','Validation bias','Hyperparameter error'],a:1,e:'Generalization (out-of-sample) error оценивается на test set.'},
{s:'Code',t:'fill',q:'Compute the average price per product in Chipotle.',code:"chipo.groupby('item_name')['item_price'].____()",a:['mean'],e:'mean() — среднее по группе.'}
],
'Вариант B':[
{s:'U1',t:'mc',q:'In self-supervised learning, the model generates its own labels from the data.',o:TF,a:0,e:'Пример: замаскировать слово «mat» и предсказать его.'},
{s:'U1',t:'mc',q:'In which type of learning does the model receive rewards or penalties depending on its actions?',o:['Supervised','Unsupervised','Reinforcement learning','Self-supervised'],a:2,e:'RL учит policy, максимизирующую награду.'},
{s:'U1',t:'mc',q:'Forecasting your company’s revenue next year based on performance metrics is:',o:['Classification','Regression','Clustering','Anomaly detection'],a:1,e:'Предсказание числа → regression.'},
{s:'LA',t:'fill',q:'Compute the magnitude (Euclidean norm) of vector v.',code:"length = np.linalg.____(v)",a:['norm'],e:'‖v‖ = √(Σvᵢ²).'},
{s:'U1',t:'mc',q:'In online learning, the model learns one data point (or a small batch) at a time.',o:TF,a:0,e:'Online (incremental) — обновляется по мере поступления данных.'},
{s:'LA',t:'mc',q:'With broadcasting, adding an array of shape (3, 1) to an array of shape (1, 4) gives shape:',o:['(3, 1)','(1, 4)','(3, 4)','Error'],a:2,e:'Col + Row → (m, n).'},
{s:'LA',t:'fill',q:'Compute the outer product of a and b in NumPy.',code:"M = np.____(a, b)",a:['outer'],e:'np.outer строит матрицу из столбца и строки.'},
{s:'U1',t:'mc',q:'Which is an example of data mismatch?',o:['Training a weather model on summer data and testing on winter data','Using too many neighbors in kNN','Using random_state=42','Training with mini-batches'],a:0,e:'Train и test из разных распределений.'},
{s:'U1',t:'mc',q:'Reducing the regularization hyperparameter is a way to fix underfitting.',o:TF,a:0,e:'Меньше ограничений → модель может стать сложнее.'},
{s:'LA',t:'fill',q:'Compute predictions as matrix–vector multiplication of X and w.',code:"y_hat = X ____ w",a:['@'],e:'@ — матричное умножение.'},
{s:'LA',t:'mc',q:'The set S = {[1, 3], [2, 6]} is:',o:['Linearly independent','Linearly dependent','A basis of ℝ²','Orthogonal'],a:1,e:'[2, 6] = 2·[1, 3].'},
{s:'Code',t:'fill',q:"Fill missing values in 'age' with the median.",code:"df['age'] = df['age'].____(df['age'].median())",a:['fillna'],e:'fillna() заполняет NaN.'},
{s:'U1',t:'mc',q:'Which of these is an unsupervised learning task?',o:['Spam classification','House price prediction','Dimensionality reduction','Cat vs dog recognition'],a:2,e:'Dimensionality reduction работает без меток.'},
{s:'LA',t:'mc',q:'The dot product is commutative: aᵀb = bᵀa.',o:TF,a:0,e:'Свойство symmetry.'},
{s:'Code',t:'fill',q:'Get the array of iris species names.',code:"iris['____']",a:['target_names'],e:"→ ['setosa', 'versicolor', 'virginica']."},
{s:'U1',t:'mc',q:'Feature extraction means:',o:['Selecting the most useful existing features','Combining existing features to produce a more useful one','Gathering new data','Removing outliers'],a:1,e:'Например, объединить mileage и age машины в один признак.'},
{s:'U1',t:'mc',q:'According to the lecture, a good rule of thumb for test set size is:',o:['5%','10%','25%','50%'],a:2,e:'25% (75/25 split).'},
{s:'LA',t:'mc',q:'A basis set may contain linearly dependent vectors.',o:TF,a:1,e:'Базис обязан быть линейно независимым — иначе координаты не уникальны.'},
{s:'LA',t:'mc',q:'In NumPy, np.array([1, 2, 3]) has shape:',o:['(3, 1)','(1, 3)','(3,)','(3, 3)'],a:2,e:'1D-массив имеет shape (3,) и ведёт себя как строка.'},
{s:'U1',t:'mc',q:'Why is mini-batch learning the most common approach in deep learning?',o:['It needs no data','It balances efficiency and stability','It avoids the test set','It removes the need for hyperparameters'],a:1,e:'Батчи по 32/64/128 — компромисс между скоростью и стабильностью.'}
],
'Вариант C':[
{s:'U1',t:'mc',q:'Which is a limitation of instance-based learning?',o:['Needs to store the whole dataset','Cannot adapt to new data','Requires long training time','Too compact'],a:0,e:'Хранит всё → дорого по памяти и медленно предсказывает.'},
{s:'U1',t:'mc',q:'Which is a strength of model-based learning?',o:['Stores all training instances','Fast predictions once trained','No training needed','Insensitive to model choice'],a:1,e:'Хранит только модель → быстрые предсказания.'},
{s:'Code',t:'fill',q:'Select the first observation (whole first row) of matrix X.',code:"X[0, ____]",a:[':'],e:'X[0, :] — первая строка; X[:, 0] — первый признак.'},
{s:'LA',t:'mc',q:'The magnitude (norm) of a vector can be negative.',o:TF,a:1,e:'Норма ≥ 0; равна 0 только у нулевого вектора.'},
{s:'LA',t:'mc',q:'When cos θ = −1 between two vectors, the dot product is:',o:['Zero','Max positive','Max negative','Undefined'],a:2,e:'θ = 180°, векторы противоположны → −‖a‖‖b‖.'},
{s:'LA',t:'fill',q:'Transpose a row vector v into a column vector in NumPy.',code:"v_col = v.____",a:['T'],e:'.T — транспонирование.'},
{s:'LA',t:'mc',q:'What is [1, 2, 3] · [4, 5, 6]?',o:['21','32','[4, 10, 18]','36'],a:1,e:'4 + 10 + 18 = 32. [4, 10, 18] — это Hadamard.'},
{s:'LA',t:'mc',q:'The vectors [1, 1, 1] and [2, 2, 2] in ℝ³ span:',o:['A 3D space','A 2D plane','A 1D line','Only the origin'],a:2,e:'Второй = 2× первый → избыточен, span — линия.'},
{s:'U1',t:'mc',q:'Constraining a model to make it simpler and reduce the risk of overfitting is called regularization.',o:TF,a:0,e:'Определение из лекции.'},
{s:'Code',t:'fill',q:'Import the kNN classifier.',code:"from sklearn.____ import KNeighborsClassifier",a:['neighbors'],e:'Класс находится в модуле neighbors.'},
{s:'U1',t:'mc',q:'A spam filter that learns on the fly using a deep neural network trained on human-labeled spam/ham is:',o:['Batch, instance-based, unsupervised','Online, model-based, supervised','Online, instance-based, semi-supervised','Batch, model-based, reinforcement'],a:1,e:'Пример из лекции.'},
{s:'U1',t:'mc',q:'Hyperparameters are learned automatically during training.',o:TF,a:1,e:'Задаются до обучения.'},
{s:'U1',t:'mc',q:'Which is an example of poor-quality data?',o:['Training facial recognition only on European faces','A temperature sensor recording 500°C','Using only 500 road images','Predicting house price from the owner’s favorite color'],a:1,e:'Ошибки/шум измерений. Остальное: nonrepresentative, insufficient, irrelevant features.'},
{s:'Code',t:'fill',q:'What is the shape of this new sample? (write as Python tuple)',code:"X_new = np.array([[5, 2.9, 1, 0.2]])\nX_new.shape  # → ____",a:['(1, 4)','(1,4)'],e:'1 sample × 4 features.'},
{s:'LA',t:'mc',q:'[5, 4, 8, 2] ⊙ [1, 0, 0.5, −1] =',o:['[5, 0, 4, −2]','7','[6, 4, 8.5, 1]','[5, 4, 4, 2]'],a:0,e:'Поэлементное умножение.'},
{s:'LA',t:'mc',q:'A set is linearly dependent if some nontrivial linear combination of its vectors equals the zero vector.',o:TF,a:0,e:'Формальное определение (хотя бы одно αᵢ ≠ 0).'},
{s:'Code',t:'fill',q:'Load the iris dataset function.',code:"from sklearn.datasets import ____\niris = load_iris()",a:['load_iris'],e:'load_iris возвращает Bunch-объект.'},
{s:'LA',t:'mc',q:'Rank of a matrix roughly means:',o:['Number of rows','Number of independent directions/information','Largest element','Number of zero elements'],a:1,e:'Redundant-признаки не увеличивают rank.'},
{s:'Code',t:'fill',q:'Remove duplicated rows from df.',code:"df_clean = df.____()",a:['drop_duplicates'],e:'drop_duplicates() убирает повторы.'},
{s:'U1',t:'mc',q:'Training a facial recognition system only on European faces and deploying it in Asia is an example of:',o:['Insufficient data','Nonrepresentative training data','Overfitting','Irrelevant features'],a:1,e:'Train не отражает среду применения.'}
]};
V['Смешанный (60)']=[].concat(...Object.values(V));

const $=id=>document.getElementById(id),L='ABCDE';
let cur=Object.keys(V)[0],Q,order,pos,st,filter;
const norm=s=>s.trim().replace(/^\./,'').replace(/\(\)$/,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function tabs(){$('tabs').innerHTML=Object.keys(V).map(k=>`<button class="tab ${k===cur?'on':''}" data-k="${k}">${k}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.k;init(cur.startsWith('Смеш'))});}
function init(sh){Q=V[cur];order=Q.map((_,k)=>k);if(sh)order.sort(()=>Math.random()-.5);st={};pos=0;filter=null;tabs();render();}
const list=()=>filter||order;
function render(){
 const ls=list(),k=ls[pos],q=Q[k],s=st[k];
 const done=Object.keys(st).length,ok=Object.values(st).filter(x=>x.ok).length;
 $('stats').textContent=`Отвечено ${done}/${Q.length} · ✓ ${ok} · ✗ ${done-ok}`;
 $('prog').style.width=(done/Q.length*100)+'%';
 let h=`<div class="qn">Вопрос ${pos+1} из ${ls.length}${filter?' (ошибки)':''}<span class="tag">${q.s}</span></div><div class="q">${esc(q.q)}</div>`;
 if(q.code)h+=`<pre>${esc(q.code).replace(/_{3,}/g,'<span class="blank">____</span>')}</pre>`;
 if(q.t==='mc')q.o.forEach((o,j)=>{let c='',m='';if(s){if(j===q.a){c='ok';m='✓ верно'}else if(j===s.v){c='bad';m='✗ ваш ответ'}}
  h+=`<button class="opt ${c}" data-j="${j}" ${s?'disabled style="opacity:1"':''}><span class="key">${L[j]}</span><span>${esc(o)}</span><span class="mark">${m}</span></button>`;});
 else h+=`<input type="text" id="inp" autocomplete="off" spellcheck="false" placeholder="Впишите пропуск…" ${s?'disabled':''} class="${s?(s.ok?'ok':'bad'):''}" value="${s?esc(s.v):''}">`;
 if(s){const ans=q.t==='mc'?q.o[q.a]:q.a[0];h+=`<div class="fb ${s.ok?'ok':'bad'}"><b>${s.ok?'✓ Верно':'✗ Неверно — ответ: '+esc(ans)}</b>${esc(q.e)}</div>`;}
 h+=`<div class="nav"><button id="prev" ${pos?'':'disabled'}>← Назад</button>`+(s||q.t==='mc'?'':`<button class="primary" id="chk">Проверить</button>`)+`<button class="${s?'primary':''}" id="next">${pos<ls.length-1?'Далее →':'Итог 🏁'}</button></div>`;
 $('card').innerHTML=h;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
 if($('chk'))$('chk').onclick=()=>answer($('inp').value);
 $('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
 const inp=$('inp');if(inp&&!s)inp.focus();
 $('dots').innerHTML=ls.map((kk,j)=>{const x=st[kk];return `<button class="dot ${x?(x.ok?'ok':'bad'):''} ${j===pos?'cur':''}" data-j="${j}">${x?(x.ok?'✓':'✗'):j+1}</button>`}).join('');
 document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{pos=+b.dataset.j;render()});
}
function answer(v){const k=list()[pos],q=Q[k];if(st[k])return;
 if(q.t==='fill'){if(!v.trim())return;st[k]={v,ok:q.a.some(a=>norm(a)===norm(v))};}else st[k]={v,ok:v===q.a};render();}
function go(d){const n=pos+d;if(n>=list().length)return result();if(n>=0){pos=n;render()}}
function result(){
 const ok=Object.values(st).filter(x=>x.ok).length,done=Object.keys(st).length;
 let h=`<h2 style="margin-top:0">${cur}: ${ok} / ${Q.length}</h2><p>Отвечено: ${done} · ${Math.round(ok/Q.length*100)}%</p>`;
 const bad=order.filter(k=>st[k]&&!st[k].ok);
 if(bad.length){h+='<h3>Ошибки</h3>';bad.forEach(k=>{const q=Q[k];h+=`<div class="wrong">${esc(q.q)}${q.code?`<pre>${esc(q.code)}</pre>`:''}<div>Ваш ответ: <code>${esc(q.t==='mc'?q.o[st[k].v]:st[k].v)}</code></div><div class="a">✓ ${esc(q.t==='mc'?q.o[q.a]:q.a[0])}</div></div>`})}
 h+=`<div class="nav"><button id="back">← К вопросам</button>${bad.length?'<button class="primary" id="redo">Повторить ошибки</button>':''}</div>`;
 $('card').innerHTML=h;$('dots').innerHTML='';
 $('back').onclick=()=>{pos=0;render()};
 if($('redo'))$('redo').onclick=()=>{bad.forEach(k=>delete st[k]);filter=bad;pos=0;render()};
}
$('shuf').onclick=()=>init(true);$('reset').onclick=()=>init(false);$('finish').onclick=result;
$('onlyBad').onclick=()=>{const b=order.filter(k=>st[k]&&!st[k].ok);if(!b.length)return alert('Ошибок пока нет');b.forEach(k=>delete st[k]);filter=b;pos=0;render()};
document.addEventListener('keydown',e=>{
 const inp=$('inp');if(!$('prev'))return;const k=list()[pos];
 if(e.key==='Enter'){e.preventDefault();if(st[k])go(1);else if(inp)answer(inp.value);return;}
 if(document.activeElement===inp)return;
 if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
 else if(/^[1-5]$/.test(e.key)&&Q[k].t==='mc'&&+e.key<=Q[k].o.length)answer(+e.key-1);
});
init(false);
</script>
