<script>
// Variant 2
const Q2=[
{t:"A company has 10 million customer records, but many are incomplete, duplicated, or outdated. Another company has 1,000 complete and recently updated records. What is the most appropriate conclusion?",
o:["The first company necessarily has better information because it has more records.","Both companies have equally reliable information because both use databases.","The second company may have more useful information because its data quality is higher.","The first company has better information because duplicated records improve accuracy.","The second company has less useful information because its database is smaller."],
a:[2],e:"Ценность информации определяет качество данных (полнота, актуальность, отсутствие дублей), а не объём. 10 млн «грязных» записей дают меньше пользы, чем 1000 чистых."},
{t:"Which statement correctly distinguishes data from information?",
o:["Data are raw facts, while information is data interpreted in a meaningful format for a purpose.","Data are processed results, while information consists of unorganized facts.","Data and information are identical because both consist of facts.","Data are used only by computers, while information is used only by people.","Data represent decisions, while information represents the technology used to make them."],
a:[0],e:"Данные — сырые факты (например, «42»). Информация — данные, обработанные и поданные в осмысленном виде для цели («42 заказа за день, на 10% больше вчерашнего»). В B определения перевёрнуты."},
{t:"Which of the following are examples of qualitative data?",
o:["Statistics, financial information, marketing trends expressed in numbers.","Costs of goods, sales per month, profit per quarter.","Names, addresses, photographs, videos, descriptions, opinions.","Data collected and entered by users or automatically.","Calculate and analyze information."],
a:[2],e:"Качественные данные описывают свойства и не выражаются числами: имена, фото, мнения. A и B — количественные (числа), D — способ сбора, E — вообще действие."},
{t:"What is the difference between application control and general control?",
o:["Application control manages memory and hardware resources, while general control manages application programs.","Application control is built into the system: firewalls, encryption, access control; general control is a process for how the system is used, for example, routine password updates.","Application control gathers data from customers and records, while general control calculates and analyzes information.","Application control stores data securely, while general control retrieves reports from storage.","Application control provides information to users, while general control collects data automatically."],
a:[1],e:"По лекции: application control встроен в саму систему (технические механизмы), general control — это процесс и правила использования системы людьми (например, регулярная смена паролей). Остальные варианты описывают функции ОС или обработку данных, а не контроль."},
{t:"What does a switching cost mean in the context of a business?",
o:["The expense of replacing outdated company technology.","The cost of moving products between company locations.","The expense of changing suppliers for business operations.","What a customer loses by leaving a company.","The cost of introducing a product to a new market."],
a:[2],e:"Switching cost — затраты на смену поставщика (перенастройка процессов, обучение, контракты). Высокие switching costs ослабляют силу поставщиков/покупателей в модели Портера."},
{t:"Which of the following correctly lists the five competitive forces?",
o:["Supplier power, barriers to entry, rivalry, substitutes, customer power.","Substitutes, supplier power, customer power, barriers to entry, rivalry.","Substitutes, supplier power, customer power, barriers to entry, innovation.","Substitutes, supplier power, customer power, barriers to entry, rivalry.","Rivalry, barriers to entry, supplier power, customer power, differentiation."],
a:[0,1,3],e:"Пять сил Портера: соперничество (rivalry), барьеры входа (новые игроки), товары-заменители, сила поставщиков, сила покупателей. C и E неверны: innovation и differentiation — не силы, а стратегии.",
n:"На листе варианты A, B и D перечисляют одни и те же пять сил (B и D вообще совпадают дословно), поэтому здесь засчитывается любой из них. На экзамене, скорее всего, ожидался B."},
{t:"Which storage type is recommended when the lowest cost per storage is the main priority?",
o:["An SSD, because it is faster and has no moving parts.","An SSD, because it is cheaper and more durable than a hard disk.","A hard disk, because it offers the lowest cost per storage.","RAM, because it stores large amounts of data at a low cost.","An SSD for the operating system and a hard disk for the rest."],
a:[2],e:"HDD даёт самую низкую цену за гигабайт. SSD быстрее, но дороже за единицу объёма (поэтому B ложь), RAM — самая дорогая и энергозависимая."},
{t:"Which statement correctly describes integrated computing?",
o:["Computers connected through removable media.","Computers designed exclusively for portable use.","Computers that rely on cloud storage for all operations.","Computers with larger screens and longer battery life.","Computers inside everyday objects that were once purely mechanical."],
a:[4],e:"Integrated (embedded) computing — компьютеры, встроенные в привычные предметы: автомобили, холодильники, термостаты. Основа Internet of Things."},
{t:"What is one characteristic of many laptops and notebooks mentioned in the lecture?",
o:["Many weigh less than 4 pounds and have longer battery life.","They weigh under 3 pounds and are 0.68 inches thick.","They have no hard drive, use cloud storage, need Wi-Fi, and run browsers and a word processor.","They use a 3D printer as their primary output device.","They do not support wireless networking."],
a:[0],e:"Общая черта ноутбуков: лёгкие (до ~4 фунтов) и с долгой работой от батареи. B — характеристики конкретной тонкой модели, C — описание облачного ноутбука (Chromebook), а не ноутбуков в целом.",
n:"Ответ зависит от формулировки на слайде. Если в лекции «many laptops» описаны иначе, сверься со слайдом."},
{t:"How can a company avoid competing mainly on price when many products are similar?",
o:["Open standards, same products, price war.","A unique product, higher price.","Little difference between models, price decides.","Buyers compare prices, minimal profit margins.","Hundreds of makers worldwide, thin profit margins."],
a:[1],e:"Стратегия дифференциации: уникальный продукт позволяет держать более высокую цену. Остальные варианты описывают как раз рынок товаров-«одинаковок» с ценовой войной."},
{t:"What is the main purpose of enterprise software?",
o:["To manage the computer's hardware and system resources.","To help an individual complete a specific task.","To connect the whole company and manage big business processes.","To translate instructions between the OS and a hardware device.","To create programs using a programming language."],
a:[2],e:"Enterprise software (ERP, CRM, SCM) связывает отделы компании и поддерживает сквозные бизнес-процессы. A — ОС, B — прикладная программа, D — драйвер, E — среда разработки."},
{t:"Who is responsible for fixing problems with on-premise systems and cloud computing, respectively?",
o:["The provider fixes both on-premise and cloud systems.","The company's IT team fixes both on-premise and cloud systems.","The provider fixes on-premise systems, while the company's IT team fixes cloud systems.","The company and the provider always share responsibility equally.","The company's IT team fixes on-premise systems, while the provider fixes cloud systems."],
a:[4],e:"On-premise — серверы стоят у компании, чинит своя IT-команда. Cloud — инфраструктура у провайдера, её обслуживает провайдер. Порядок «respectively» важен: C — то же, но наоборот."},
{t:"Which statement correctly describes the Waterfall model?",
o:["Software is built in small parts, with frequent customer feedback.","Each step is finished completely before the next step starts.","The team changes the plan after every short work period.","The customer gives feedback throughout the development process.","The first working product is delivered after the first sprint."],
a:[1],e:"Waterfall — последовательные фазы (требования → дизайн → разработка → тестирование → внедрение), следующая начинается только после завершения предыдущей. A, C, D, E описывают Agile/Scrum."},
{t:"In the Anthony framework, strategic data are generally:",
o:["Detailed and time-sensitive.","Transactional and updated continuously.","Summarized for daily operational control.","Aggregated and less time-sensitive than management data.","Limited to individual customer transactions."],
a:[3],e:"Пирамида Энтони: operational (детальные, срочные) → management (сводки) → strategic (агрегированные, долгосрочные, менее срочные). Чем выше уровень, тем больше агрегация."},
{t:"Which statement correctly distinguishes validity from accuracy?",
o:["Validity measures whether data are current, while accuracy measures whether records are unique.","Validity checks whether data follow rules, while accuracy checks whether they are true in the real world.","Validity measures whether fields are complete, while accuracy measures whether systems agree.","Validity checks whether data are unique, while accuracy measures whether required fields are filled.","Validity measures whether data are consistent, while accuracy measures whether they follow a standard format."],
a:[1],e:"Validity: значение соответствует правилам (формат даты, допустимый диапазон). Accuracy: значение верно в реальности. Пример: возраст «35» валиден, но неточен, если человеку 40."},
{t:"Data retention refers to:",
o:["Protecting personal data from unauthorized disclosure.","Storing data for a defined period through archiving and purging.","Preventing unauthorized users from accessing information.","Ensuring that data remain accurate throughout their life cycle.","Combining information from multiple systems into one dataset."],
a:[1],e:"Retention — политика хранения: сколько держать данные, когда архивировать и когда удалять (purge). A — privacy, C — security, D — integrity, E — integration."},
{open:true,t:"A company is choosing between an off-the-shelf software package and a custom-built solution. Explain two factors it should consider and justify when custom-built software would be the better choice.",
m:["<b>Стоимость и время.</b> Готовый пакет дешевле и внедряется быстро; custom требует больших вложений и месяцев разработки.","<b>Соответствие процессам.</b> Готовое ПО заставляет подстраивать процессы под себя; custom строится точно под требования компании.","Также можно назвать: поддержку и обновления, масштабируемость, интеграцию с текущими системами, риски проекта.","<b>Когда custom лучше:</b> если процессы компании уникальны и дают конкурентное преимущество (например, своя логистика или алгоритм ценообразования), а готовые решения их не покрывают. Тогда высокая цена окупается тем, что конкуренты не могут купить то же самое."]},
{open:true,t:"A team discovers that several records in its dataset are duplicated and some required values are missing. Explain how the team can address these two data quality problems and describe one role responsible for establishing data rules.",
m:["<b>Дубликаты:</b> найти по ключевым полям (ID, email), объединить или удалить лишние записи (deduplication); на будущее задать уникальный ключ / unique constraint, чтобы повтор не вставлялся.","<b>Пропуски:</b> уточнить значения у источника или восстановить из других систем; на будущее сделать поля обязательными (NOT NULL, валидация в форме ввода).","<b>Роль: Data Steward.</b> Отвечает за качество данных в своей области: задаёт правила (форматы, обязательные поля, уникальность), следит за их соблюдением и исправлением ошибок. Также подходит Data Owner, который утверждает эти правила."]}
];
// Variant 1 (incomplete: only questions 1–11 were photographed with their options)
const Q1=[
{t:"What is an Information System (IS)?",
o:["A computer program used exclusively for calculations.","A collection of interconnected components that collect, process, store, and share data to support decisions.","A physical device used to connect computers to the Internet.","A database that stores information without processing it.","A network used only for communication between employees."],
a:[1],e:"IS — это система взаимосвязанных компонентов (hardware, software, data, procedures, people), которая собирает, обрабатывает, хранит и распространяет данные для принятия решений. Остальные варианты описывают лишь одну часть (программу, сеть, БД)."},
{t:"A shop owner records daily sales in a paper notebook, calculates total revenue, and uses the results to decide what products to order. Why can this be considered an Information System?",
o:["Every Information System must use an electronic device.","A notebook automatically processes data without human involvement.","The system uses only technology and does not involve people.","It transforms recorded data into useful information for decision-making.","It stores information but does not support any business activity."],
a:[3],e:"IS не обязана быть компьютерной. Здесь есть ввод (записи продаж), обработка (подсчёт выручки), вывод (итог) и решение (что заказать) — значит, это информационная система, хоть и бумажная."},
{t:"What is the job of an operating system (OS)?",
o:["Programs that let computers perform specific tasks.","Manages memory and hardware resources; interface for users; manages application programs.","Writes code for the analyst design.","Detailed instructions and policies for the system.","Information given to users, retrieved securely and easily."],
a:[1],e:"ОС управляет памятью и железом, даёт интерфейс пользователю и запускает приложения (Windows, macOS, Android). A — это прикладные программы, D — процедуры (procedures), E — вывод информации."},
{t:"What is the meaning of processing in an Information System?",
o:["Data collected and entered by users or automatically.","Information given to users, retrieved securely and easily.","Tasks that make data useful.","Keep it secure, reliable and accessible.","Take it out of storage."],
a:[2],e:"Цикл IS: input (A — сбор данных) → processing (C — вычисления и анализ, которые делают данные полезными) → storage (D) → retrieval (E) → output (B)."},
{t:"Which characteristics must a resource have to support a lasting competitive advantage, according to the lecture?",
o:["Profitable, efficient, scalable, easy to maintain.","Valuable, common, easy to imitate, without substitutes.","Rare, inexpensive, widely available, difficult to maintain.","Valuable, profitable, efficient, difficult to replace.","Valuable, rare, tough to imitate, without substitutes."],
a:[4],e:"Модель VRIN: Valuable, Rare, Inimitable, Non-substitutable. Если ресурс обычный или легко копируется (B, C), конкуренты быстро догонят."},
{t:"What is the main difference between operational effectiveness and strategic positioning?",
o:["Operational effectiveness lowers prices; strategic positioning increases advertising.","Operational effectiveness implies doing the same tasks better than rivals; strategic positioning involves different activities or different ways of performing them.","Operational effectiveness changes the business model; strategic positioning reduces manual work.","Operational effectiveness develops new markets; strategic positioning improves routine tasks.","Operational effectiveness focuses on customers; strategic positioning focuses on suppliers."],
a:[1],e:"По Портеру: operational effectiveness — делать то же самое, что конкуренты, но лучше (быстрее, дешевле); его легко скопировать. Strategic positioning — делать другое или по-другому, это и даёт устойчивое преимущество."},
{t:"Which of the following correctly lists the five components of a computer?",

const VARS={1:Q1,2:Q2,3:Q3};
const VNOTE={1:" (неполный)",3:" (вопросы 2–10)"};
const L="ABCDE";
const num=i=>Q[i].no??i+1; // sheet number (no) for variants with gaps
let V=2,Q,S,cur=0;
function setVar(n){V=n;Q=VARS[n];S=Q.map(()=>({pick:null,done:false,text:"",shown:false}));cur=0;try{localStorage.setItem("inft-variant",n)}catch(e){}
  $("course").textContent=`INFT3107 · Midterm · Variant ${n}`+(VNOTE[n]||"");
  $("vsw").innerHTML=Object.keys(VARS).map(k=>`<button class="${k==n?"on":""}" data-v="${k}">Вариант ${k}</button>`).join("");
  $("ruler").style.gridTemplateColumns=`repeat(${Math.max(Q.length,11)},1fr)`}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function isRight(i){return Q[i].a.includes(S[i].pick)}
function status(i){const q=Q[i],s=S[i];if(q.open)return s.shown?"open":"";if(!s.done)return"";return isRight(i)?"ok":"bad"}
function scoreTxt(){const mc=Q.filter(q=>!q.open).length;let ok=0,done=0;Q.forEach((q,i)=>{if(!q.open&&S[i].done){done++;if(isRight(i))ok++}});return{ok,done,mc}}
function renderRuler(){$("ruler").innerHTML=Q.map((q,i)=>`<button class="tick ${status(i)} ${i===cur?"cur":""}" data-i="${i}" aria-label="Вопрос ${num(i)}">${num(i)}</button>`).join("");
  const s=scoreTxt();$("score").textContent=`${s.ok} / ${s.mc} верно · отвечено ${s.done}`}
function render(){
  renderRuler();
  if(cur===Q.length)return renderResult();
  const q=Q[cur],s=S[cur];let h=`<div class="qhead"><span class="qnum">Question ${num(cur)}${q.no?` · ${cur+1} of ${Q.length}`:` of ${Q.length}`}</span><span class="tag">${q.open?"Open · 2 pts":"Single answer · 1 pt"}</span></div><p class="qtext">${esc(q.t)}</p>`;
  if(!q.open){
    h+=`<div class="opts">`+q.o.map((o,j)=>{let c="";if(s.done){if(q.a.includes(j))c="right";else if(j===s.pick)c="wrong"}else if(j===s.pick)c="sel";
      return `<button class="opt ${c}" data-j="${j}" ${s.done?"disabled":""}><span class="letter">${L[j]}</span><span>${esc(o)}</span></button>`}).join("")+`</div>`;
    if(s.done){const ok=isRight(cur);h+=`<div class="explain ${ok?"ok":"bad"}"><b>${ok?"Верно.":"Неверно. Правильный ответ: "+q.a.map(k=>L[k]).join(", ")+"."}</b><span>${q.e}</span></div>`;if(q.n)h+=`<div class="note"><b>Важно.</b> ${q.n}</div>`}
  }else{
    h+=`<label for="ans${cur}" class="tag" style="align-self:flex-start">Ваш ответ</label><textarea id="ans${cur}" placeholder="Напишите ответ своими словами, затем сравните с образцом">${esc(s.text)}</textarea>`;
    if(s.shown)h+=`<div class="explain info model"><b>Образец ответа — ключевые пункты</b><ul>${q.m.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  }
  $("card").innerHTML=h;
  const ta=$("card").querySelector("textarea");if(ta)ta.addEventListener("input",e=>{S[cur].text=e.target.value});
  renderBar();
}
function renderBar(){
  const q=Q[cur],s=S[cur];let main;
  if(cur===Q.length){$("bar").innerHTML=`<button class="btn" id="b-review">К вопросу 1</button><button class="btn primary" id="b-reset">Пройти заново</button>`;return}
  if(!q.open)main=s.done?`<button class="btn primary" id="b-next">${cur===Q.length-1?"Результат":"Дальше"}</button>`:`<button class="btn primary" id="b-check" ${s.pick===null?"disabled":""}>Проверить</button>`;
  else main=s.shown?`<button class="btn primary" id="b-next">${cur===Q.length-1?"Результат":"Дальше"}</button>`:`<button class="btn primary" id="b-show">Показать образец</button>`;
  $("bar").innerHTML=`<button class="btn small" id="b-prev" ${cur===0?"disabled":""} aria-label="Назад">←</button>${main}`;
}
function renderResult(){
  const s=scoreTxt();const pct=Math.round(s.ok/s.mc*100);
  const no=Q.length-Q.filter(q=>q.open).length;
  let h=`<div class="result"><span class="course">Итог по вопросам ${num(0)}–${num(s.mc-1)}</span><div class="big">${s.ok}<small> / ${s.mc} · ${pct}%</small></div>
  <p style="margin:0;color:var(--muted)">${no<Q.length?`Открытые вопросы ${no+1}–${Q.length} оцените сами по образцу. `:""}Нажмите на строку, чтобы вернуться к вопросу.</p><ul class="rev">`;
  Q.forEach((q,i)=>{const st=status(i)||"skip";const m=q.open?(S[i].shown?"OPEN":"—"):(S[i].done?(isRight(i)?"✓ "+L[S[i].pick]:"✗ "+L[S[i].pick]):"—");
    h+=`<li class="${st}" data-i="${i}"><span class="m">${num(i)}. ${m}</span><span class="t">${esc(q.t)}</span></li>`});
  $("card").innerHTML=h+`</ul></div>`;renderBar();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-i],[data-j],[data-v],button");if(!t)return;
  if(t.dataset.v!==undefined){setVar(+t.dataset.v);render();window.scrollTo({top:0});return}
  if(t.dataset.j!==undefined&&!S[cur].done){S[cur].pick=+t.dataset.j;return render()}
  if(t.dataset.i!==undefined){cur=+t.dataset.i;render();window.scrollTo({top:0});return}
  switch(t.id){
    case"b-check":S[cur].done=true;render();break;
    case"b-show":S[cur].shown=true;render();break;
    case"b-next":cur++;render();window.scrollTo({top:0});break;
    case"b-prev":cur--;render();window.scrollTo({top:0});break;
    case"b-review":cur=0;render();break;
    case"b-reset":S.forEach(s=>Object.assign(s,{pick:null,done:false,text:"",shown:false}));cur=0;render();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||cur===Q.length)return;const k=e.key.toUpperCase();
  if(!Q[cur].open&&!S[cur].done&&L.includes(k)&&k.length===1){S[cur].pick=L.indexOf(k);render()}
  else if(e.key==="Enter"){const b=$("b-check")||$("b-next");if(b&&!b.disabled)b.click()}
});
{let v=2;try{const s=+localStorage.getItem("inft-variant");if(VARS[s])v=s}catch(e){}setVar(v)}
render();
</script>
