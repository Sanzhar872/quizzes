, "k": [0]}, {"n": 8, "s": "Which method is used by some malware to transfer files from infected hosts to a threat actor host?", "o": ["UDP infiltration", "ICMP tunneling", "iFrame injection", "HTTPS traffic encryption"], "k": [1]}, {"n": 9, "s": "Match the Windows host log to the messages contained in it.", "l": ["events logged by various applications", "events related to logon attempts and operations related to file or object management and access", "information about the installation of software, including Windows updates", "events related to the operation of drivers, processes, and hardware"], "o": ["application logs", "setup logs", "security logs", "system logs"], "k": [0, 2, 1, 3]}, {"n": 10, "s": "What is a key difference between the data captured by NetFlow and data captured by Wireshark?", "o": ["NetFlow collects metadata from a network flow whereas Wireshark captures full data packets.", "NetFlow data is analyzed by tcpdump whereas Wireshark data is analyzed by nfdump.", "NetFlow data shows network flow contents whereas Wireshark data shows network flow statistics.", "NetFlow provides transaction data whereas Wireshark provides session data."], "k": [0]}, {"n": 11, "s": "Which type of data is used by Cisco Cognitive Intelligence to find malicious activity that has bypassed security controls, or entered through unmonitored channels, and is operating inside an enterprise network?", "o": ["statistical", "session", "alert", "transaction"], "k": [0]}, {"n": 12, "s": "Match the network monitoring data type with the description.", "l": ["includes device-specific server and host logs", "generated by IPS or IDS devices when suspicious traffic is detected", "used to describe and analyze network flow or performance data", "contains details of network flows including the 5-tuples, the amount of data transmitted, and the duration of data transmission"], "o": ["statistical data", "transaction data", "alert data", "session data"], "k": [1, 2, 0, 3]}, {"n": 13, "s": "Which Cisco appliance can be used to filter network traffic contents to report and deny traffic based on the web server reputation?", "o": ["WSA", "ESA", "ASA", "AVC"], "k": [0]}, {"n": 14, "s": "A system administrator runs a file scan utility on a Windows PC and notices a file lsass.exe in the Program Files directory. What should the administrator do?", "o": ["Move it to Program Files (x86) because it is a 32bit application.", "Open the Task Manager, right-click on the lsass process and choose End Task.", "Delete the file because it is probably malware.", "Uninstall the lsass application because it is a legacy application and no longer required by Windows."], "k": [2]}, {"n": 15, "s": "How does a web proxy device provide data loss prevention (DLP) for an enterprise?", "o": ["by functioning as a firewall", "by inspecting incoming traffic for potential exploits", "by checking the reputation of external web servers", "by scanning and logging outgoing traffic"], "k": [3]}, {"n": 16, "s": "Which two services are provided by the NetFlow tool? (Choose two.)", "o": ["network monitoring", "log analysis", "access list monitoring", "QoS configuration", "usage-based network billing"], "k": [0, 4]}, {"n": 17, "s": "What information is contained in the options section of a Snort rule?", "o": ["source and destination address", "action to be taken", "text describing the event", "direction of traffic flow"], "k": [2]}, {"n": 18, "s": "Which classification indicates that an alert is verified as an actual security incident?", "o": ["true negative", "false negative", "false positive", "true positive"], "k": [3]}, {"n": 19, "s": "Match the characteristic to the method of security analysis.", "l": ["each event is the inevitable result of antecedent causes", "precise method that yields the same result every time by relying on predefined conditions", "analysis of applications that conform to application/networking standards", "random variables create difficulty in knowing the outcome of any given event with certainty", "preferred method for analyzing applications designed to circumvent firewalls"], "o": ["Deterministic", "Probabilistic"], "k": [0, 0, 0, 1, 1], "reuse": true}, {"n": 20, "s": "A threat actor has successfully breached the network firewall without being detected by the IDS system. What condition describes the lack of alert?", "o": ["false negative", "true positive", "true negative", "false positive"], "k": [0]}, {"n": 21, "s": "What are two scenarios where probabilistic security analysis is best suited? (Choose two.)", "o": ["when applications that conform to application/networking standards are analyzed", "when random variables create difficulty in knowing with certainty the outcome of any given event", "when each event is the inevitable result of antecedent causes", "when analyzing applications designed to circumvent firewalls", "when analyzing events with the assumption that they follow predefined steps"], "k": [1, 3]}, {"n": 22, "s": "What are the three core functions provided by the Security Onion? (Choose three.)", "o": ["security device management", "full packet capture", "alert analysis", "intrusion detection", "business continuity planning", "threat containment"], "k": [1, 2, 3]}, {"n": 23, "s": "Refer to the exhibit. Which field in the Sguil event window indicates the number of times an event is detected for the same source and destination IP address?", "o": ["CNT", "Pr", "AlertID", "ST"], "k": [0], "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmQAAAELCAYAAAB3W5quAAEAAElEQVR4nOz9dXhcV5bvD38OFJdYlizJIluSmdkxxLFjiOPYiUMdbO5J48AdvHNh7u9O35me6e7paUh3pikcx8zMzCDLlmwxMxTDgfePU1WWzEkcJ+lX3+fxY1XVOftsXHudtdf6LgHQ6Uc/+tGPfvSjH/3ox2eC2fHxyAAmk4m4uDg6Ozsxm83o+v3V0XRdx2QyYbXa8Ho99738O8Fut6PrOl6vF0EQEAThgT37iwBd1xFFEYfDgaIo+Hw+RFH8rKv1sdC7LcFgkEAggCRJn3W1vtDQdR2z2YzFYsHr9aKq6hd2fjwIROeg3W4nGAwSDAY/13NQ13XsdjuCIMRkZD9uj97rwefzoarqZ9Jnuq5jsViwWCx4PB40TfvE9Yju0w6HA5fLdV/K7Me9QVEUuhTFUMgyMzOZN28ef/jDH4iLi0NRlFve1HtwdF2PKTi6rt9RydI0jfz8fCZ et criticality, vulnerability threat, and asset classification?", "o": ["verify", "assess", "discover", "prioritize assets"], "k": [1]}, {"n": 16, "s": "When establishing a network profile for an organization, which element describes the time between the establishment of a data flow and its termination?", "o": ["total throughput", "bandwidth of the Internet connection", "routing protocol convergence", "session duration"], "k": [3]}, {"n": 17, "s": "Which security management plan specifies a component that involves tracking the location and configuration of networked devices and software across an enterprise?", "o": ["asset management", "patch management", "vulnerability management", "risk management"], "k": [0]}, {"n": 18, "s": "A security analyst is investigating a cyber attack that began by compromising one file system through a vulnerability in a custom software application. The attack now appears to be affecting additional file systems under the control of another security authority. Which CVSS v3.0 base exploitability metric score is increased by this attack characteristic?", "o": ["user interaction", "privileges required", "attack complexity", "scope"], "k": [3]}, {"n": 19, "s": "What are the steps in the vulnerability management life cycle?", "o": ["plan, do, act, check", "identify, protect, detect, respond, recover", "detect, analyze, recover, respond", "discover, prioritize assets, assess, report, remediate, verify"], "k": [3]}, {"n": 20, "s": "Why would an organization perform a quantitative risk analysis for network security threats?", "o": ["so that management has documentation about the number of security attacks that have occurred within a particular time period", "so that management can determine the number of network devices needed to inspect, analyze, and protect the corporate resources", "so that the organization knows the top areas where network security holes exist", "so that the organization can focus resources where they are most needed"], "k": [3]}, {"n": 21, "s": "The team is in the process of performing a risk analysis on the database services. The information collected includes the initial value of these assets, the threats to the assets and the impact of the threats. What type of risk analysis is the team performing by calculating the annual loss expectancy?", "o": ["protection analysis", "qualitative analysis", "loss analysis", "quantitative analysis"], "k": [3]}, {"n": 22, "s": "Based on the risk management process, what should the cybersecurity team do as the next step when a cybersecurity risk is identified?", "o": ["Frame the risk.", "Monitor the risk.", "Respond to the risk.", "Assess the risk."], "k": [3]}, {"n": 23, "s": "In which situation would a detective control be warranted?", "o": ["after the organization has experienced a breach in order to restore everything back to a normal state", "when the organization needs to repair damage", "when the organization needs to look for prohibited activity", "when the organization cannot use a guard dog, so it is necessary to consider an alternative"], "k": [2]}, {"n": 24, "s": "Which risk mitigation strategies include outsourcing services and purchasing insurance?", "o": ["transfer", "acceptance", "reduction", "avoidance"], "k": [0]}, {"n": 25, "s": "In quantitative risk analysis, what term is used to represent the degree of destruction that would occur if an event took place?", "o": ["exposure factor", "single loss expectancy", "annualized rate of occurrence", "annualized loss expectancy"], "k": [0]}, {"n": 26, "s": "Which two values are required to calculate annual loss expectancy? (Choose two.)", "o": ["annual rate of occurrence", "asset value", "frequency factor", "exposure factor", "single loss expectancy", "quantitative loss value"], "k": [0, 4]}, {"n": 27, "s": "What are the three impact metrics contained in the CVSS 3.0 Base Metric Group? (Choose three.)", "o": ["confidentiality", "remediation level", "integrity", "attack vector", "exploit", Functional test", "Operational exercise"], "k": [2]}, {"n": 5, "s": "Match the intrusion event defined in the Diamond Model of intrusion to the description.", "l": ["the target of the attack", "network path used to establish and maintain command and control", "a tool or technique used to attack the victim", "the parties responsible for the intrusion"], "o": ["adversary", "capability", "victim", "infrastructure"], "k": [2, 3, 1, 0]}, {"n": 6, "s": "What is a chain of custody?", "o": ["the disciplinary measures an organization may perform if an incident is caused by an employee", "the documentation surrounding the preservation of evidence related to an incident", "a plan ensuring that each party involved in an incident response understands how to collect evidence", "a list of all of the stakeholders that were exploited by an attacker"], "k": [1]}, {"n": 7, "s": "According to the Cyber Kill Chain model, after a weapon is delivered to a targeted system, what is the next step that a threat actor would take?", "o": ["installation", "action on objectives", "exploitation", "weaponization"], "k": [2]}, {"n": 8, "s": "In which step of the NIST incident response process does the CSIRT perform an analysis to determine which networks, systems, or applications are affected; who or what originated the incident; and how the incident is occurring?", "o": ["detection", "attacker identification", "scoping", "incident notification"], "k": [2]}, {"n": 9, "s": "Which task describes threat attribution?", "o": ["obtaining the most volatile evidence", "reporting the incident to the proper authorities", "evaluating the server alert data", "determining who is responsible for the attack"], "k": [3]}, {"n": 10, "s": "Place the seven steps defined in the Cyber Kill Chain in the correct order.", "l": ["step 1", "step 2", "step 3", "step 4", "step 5", "step 6", "step 7"], "o": ["weaponization", "exploitation", "delivery", "reconnaissance", "command and control", "action on objectives", "installation"], "k": [3, 0, 2, 1, 6, 4, 5]}, {"n": 11, "s": "Match the NIST incident response stakeholder with the role.", "l": ["preserves attack evidence", "performs disciplinary measures", "develops firewall rules", "designs the budget", "reviews policies for local or federal guideline violations"], "o": ["human resources", "IT support", "management", "information assurance", "legal department"], "k": [1, 0, 3, 2, 4]}, {"n": 12, "s": "Which type of controls restore the system after a disaster or an event?", "o": ["Preventive controls", "Detective controls", "Corrective controls"], "k": [2]}, {"n": 13, "s": "A company is applying the NIST.SP800-61 r2 incident handling process to security events. What are two examples of incidents that are in the category of precursor? (Choose two.)", "o": ["a host that has been verified as infected with malware", "multiple failed logins from an unknown source", "an IDS alert message being sent", "log entries that show a response to a port scan", "a newly-discovered vulnerability in Apache web servers"], "k": [3, 4]}, {"n": 14, "s": "What will a threat actor do to create a back door on a compromised target according to the Cyber Kill Chain model?", "o": ["Add services and autorun keys.", "Open a two-way communications channel to the CnC infrastructure.", "Obtain an automated tool to deliver the malware payload.", "Collect and exfiltrate data."], "k": [0]}, {"n": 15, "s": "What is the objective the threat actor in establishing a two-way communication channel between the target system and a CnC infrastructure?", "o": ["to allow the threat actor to issue commands to the software that is installed on the target", "to steal network bandwidth from the network where the target is located", "to send user data stored on the target to the threat actor", "to launch a buffer overflow attack"], "k": [0]}, {"n": 16, "s": "Which type of evidence supports an assertion based on previously obtained evidence?", "o": ["best evidence", "direct evidence", "indirect evidence", "corroborating evidence"], "k": [3]}, {"n": 17, "s": "What is specified in the plan element of the NIST incident response plan?", "o": ["metrics for measuring the incident response capability and effectiveness", "incident handling based on the mission of the organization", "organizational structure and the definition of roles, responsibilities, and levels of authority", "priority and severity ratings of incidents"], "k": [0]}, {"n": 18, "s": "A cybersecurity analyst has been called to a crime scene that contains several technology items including a computer. Which technique will be used so that the information found on the computer can be used in court?", "o": ["log collection", "Tor", "rootki", "unaltered disk image"], "k": [3]}, {"n": 19, "s": "According to NIST, which step in the digital forensics process involves identifying potential sources of forensic data, its acquisition, handling, and storage?", "o": ["reporting", "examination", "collection", "analysis"], "k": [2]}, {"n": 20, "s": "Which activity is typically performed by a threat actor in the installation phase of the Cyber Kill Chain?", "o": ["Obtain an automated tool to deliver the malware payload.", "Harvest email addresses of user accounts.", "Install a web shell on the target web server for persistent access.", "Open a two-way communication channel to the CnC infrastructure."], "k": [2]}]};const ids=Object.keys(data);let tab=ids[0];const states={};const range=n=>Array.from({length:n},(_,i)=>i);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function fresh(t){return {order:range(data[t].length),items:data[t].map(q=>({order:range(q.o.length),sel:[],pairs:{},pending:null,done:false,ok:false}))}}ids.forEach(t=>states[t]=fresh(t));const el=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};const btn=(txt,fn,cls)=>{let b=el('button',txt,cls);b.onclick=fn;return b};function stats(){let st=states[tab],done=st.order.filter(i=>st.items[i].done),ok=done.filter(i=>st.items[i].ok).length,n=st.order.length;let s=document.getElementById('stats');s.replaceChildren(el('div',`Отвечено: ${done.length}/${n} · Правильно: ${ok} · Ошибки: ${done.length-ok} · Результат: ${Math.round(100*ok/n)}%`));let p=el('progress');p.max=n;p.value=done.length;s.append(p);document.getElementById('retry').disabled=done.length===ok;document.getElementById('result').textContent=done.length===n?`Тест завершён! ${ok} из ${n} (${Math.round(100*ok/n)}%).`:''}function check(q,s){s.done=true;s.ok=q.l?q.k.every((v,i)=>s.pairs[i]===v):s.sel.length===q.k.length&&q.k.every(v=>s.sel.includes(v));stats()}
function draw(w,q,s){let svg=w.querySelector('svg');if(!svg)return;svg.replaceChildren();let r=w.getBoundingClientRect();function line(i,j,color,dash){let a=w.querySelector(`[data-left="${i}"]`).getBoundingClientRect(),b=w.querySelector(`[data-right="${j}"]`).getBoundingClientRect();let l=document.createElementNS('http://www.w3.org/2000/svg','line');for(let [k,v] of Object.entries({x1:a.right-r.left,y1:a.top+a.height/2-r.top,x2:b.left-r.left,y2:b.top+b.height/2-r.top,stroke:color,'stroke-width':3,'stroke-dasharray':dash?'6 4':'none'}))l.setAttribute(k,v);svg.append(l)}Object.entries(s.pairs).forEach(([i,j])=>line(i,j,s.done?(q.k[i]===j?'#239b56':'#dc4444'):'#3185c6',false));if(s.done)q.k.forEach((j,i)=>{if(s.pairs[i]!==j)line(i,j,'#239b56',true)})}
function render(){let st=states[tab];let tabs=document.getElementById('tabs');tabs.replaceChildren(...ids.map(t=>btn(`${t} (${data[t].length})`,()=>{tab=t;render()},t===tab?'active':'')));let root=document.getElementById('quiz');root.replaceChildren();st.order.forEach((idx,pos)=>{let q=data[tab][idx],s=st.items[idx],card=el('section',undefined,'card');root.append(card);function paint(){card.replaceChildren(el('div',`Вопрос ${pos+1} из ${st.order.length} · ${q.l?'Matching':q.k.length>1?'Multiple choice':'Single choice'}`,'muted'),el('h3',q.s));if(q.img){let im=el('img');im.src=q.img;im.alt='Sguil event window';im.style.cssText='max-width:100%;height:auto;display:block;margin:12px 0';card.append(im)}if(q.l){card.append(el('div',q.reuse?'Нажми на элемент слева, затем на категорию справа. Категории можно использовать несколько раз.':'Нажми на элемент слева, затем на соответствующий элемент справа.','muted'));let w=el('div',undefined,'match'),left=el('div',undefined,'side'),right=el('div',undefined,'side');let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');w.append(svg,left,right);q.l.forEach((v,i)=>{let b=btn(v,()=>{s.pending=i;paint()},s.pending===i?'selected':'');b.dataset.left=i;b.disabled=s.done;left.append(b)});s.order.forEach(j=>{let b=btn(q.o[j],()=>{if(s.pending===null)return;if(!q.reuse)for(let i of Object.keys(s.pairs))if(s.pairs[i]===j)delete s.pairs[i];s.pairs[s.pending]=j;s.pending=null;paint()});b.dataset.right=j;b.disabled=s.done;right.append(b)});card.append(w);requestAnimationFrame(()=>draw(w,q,s));if(!s.done){let b=btn('Проверить',()=>{check(q,s);paint()},'primary');b.disabled=Object.keys(s.pairs).length!==q.l.length;card.append(b,btn('Очистить линии',()=>{s.pairs={};s.pending=null;paint()}))}}else{s.order.forEach(j=>{let selected=s.sel.includes(j);let cls='opt '+(s.done?(q.k.includes(j)?'good':selected?'bad':''):selected?'selected':'');let b=btn((q.k.length>1?(selected?'☑ ':'☐ '):'')+q.o[j],()=>{if(q.k.length===1){s.sel=[j];check(q,s)}else{s.sel=selected?s.sel.filter(x=>x!==j):[...s.sel,j]}paint()},cls);b.disabled=s.done;card.append(b)});if(q.k.length>1&&!s.done){let b=btn('Проверить',()=>{check(q,s);paint()},'primary');b.disabled=s.sel.length!==q.k.length;card.append(b,el('div',`Выбрано: ${s.sel.length}/${q.k.length}`,'muted'))}}if(s.done){let f=el('div',s.ok?'✓ Правильно':'✗ Неправильно','feedback');if(!s.ok){if(q.l)q.l.forEach((v,i)=>f.append(el('p',v+' → '+q.o[q.k[i]])));else f.append(el('p','Правильный ответ: '+q.k.map(j=>q.o[j]).join('; ')))}card.append(f)}}paint()});stats()}
document.getElementById('sq').onclick=()=>{states[tab].order=shuffle(states[tab].order);render()};document.getElementById('sa').onclick=()=>{states[tab].items.forEach(s=>s.order=shuffle(s.order));render()};document.getElementById('reset').onclick=()=>{states[tab]=fresh(tab);render()};document.getElementById('retry').onclick=()=>{let old=states[tab],wrong=old.order.filter(i=>old.items[i].done&&!old.items[i].ok);if(!wrong.length)return;let st=fresh(tab);st.order=wrong;wrong.forEach(i=>st.items[i].order=[...old.items[i].order]);states[tab]=st;render()};window.addEventListener('resize',()=>{document.querySelectorAll('.match').forEach(w=>{let card=w.closest('.card'),pos=[...document.getElementById('quiz').children].indexOf(card),idx=states[tab].order[pos];draw(w,data[tab][idx],states[tab].items[idx])})});render();</script></html>
