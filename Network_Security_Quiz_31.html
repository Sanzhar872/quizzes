let questions=[],state={};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function restart(mode){if(Object.keys(state).length && !confirm('Start again? Your current answers will be cleared.'))return;state={};questions=source.map(q=>({...q,order:mode==='answers'||mode==='both'?shuffle(q.opts.map((_,i)=>i)):q.opts.map((_,i)=>i)}));if(mode==='questions'||mode==='both')questions=shuffle(questions);render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('questions').innerHTML=questions.map((q,n)=>{let kind=q.kind==='multi'?'Choose '+q.ans.length:q.kind==='match'?'Matching':'Choose one';let content=q.kind==='match'?q.prompts.map((p,i)=>`<div class="matchrow" id="row-${q.id}-${i}"><div>${esc(p)}<div class="answerline" id="line-${q.id}-${i}"></div></div><select id="sel-${q.id}-${i}"><option value="">Select a term...</option>${q.order.map(k=>`<option value="${k}">${esc(q.opts[k])}</option>`).join('')}</select></div>`).join(''):`<div id="choices-${q.id}">${q.order.map(k=>`<button class="choice ${q.kind==='multi'?'multi':''}" id="opt-${q.id}-${k}" onclick="choose(${q.id},${k})"><span class="dot"></span><span>${esc(q.opts[k])}</span></button>`).join('')}</div>`;return `<article class="card" id="card-${q.id}"><div class="number">QUESTION ${n+1} OF ${questions.length} · ${kind.toUpperCase()} · ORIGINAL #${q.id}</div><div class="question">${esc(q.q)}</div>${q.image?`<img class="exhibit" src="${q.image}" alt="Network exhibit for question ${q.id}">`:''}${content}${q.kind==='multi'?`<button class="primary" id="check-${q.id}" onclick="checkMulti(${q.id})">Check answer</button>`:''}${q.kind==='match'?`<button class="primary" id="check-${q.id}" onclick="checkMatch(${q.id})" style="margin-top:12px">Check matches</button>`:''}<div id="fb-${q.id}"></div></article>`}).join('');update()}
function getq(id){return questions.find(q=>q.id===id)}
function choose(id,k){if(state[id]?.done)return;let q=getq(id);if(q.kind==='multi'){let set=state[id]?.selected||[];set=set.includes(k)?set.filter(x=>x!==k):[...set,k];state[id]={selected:set};q.order.forEach(x=>document.getElementById(`opt-${id}-${x}`).classList.toggle('selected',set.includes(x)));return}finish(id,q.ans.includes(k),[k])}
function checkMulti(id){let q=getq(id),selected=state[id]?.selected||[];if(!selected.length){alert('Select your answers first.');return}finish(id,selected.length===q.ans.length&&selected.every(x=>q.ans.includes(x)),selected)}
function finish(id,ok,selected){let q=getq(id);state[id]={done:true,ok,selected};q.order.forEach(k=>{let b=document.getElementById(`opt-${id}-${k}`);b.disabled=true;if(q.ans.includes(k))b.classList.add('correct');else if(selected.includes(k))b.classList.add('wrong')});let button=document.getElementById('check-'+id);if(button)button.disabled=true;feedback(q,ok);update()}
function checkMatch(id){if(state[id]?.done)return;let q=getq(id),values=q.prompts.map((_,i)=>document.getElementById(`sel-${id}-${i}`).value);if(values.some(v=>v==='')){alert('Match every description before checking.');return}let ok=values.every((v,i)=>Number(v)===q.ans[i]);state[id]={done:true,ok};values.forEach((v,i)=>{let row=document.getElementById(`row-${id}-${i}`),sel=document.getElementById(`sel-${id}-${i}`);row.classList.add(Number(v)===q.ans[i]?'correct':'wrong');sel.disabled=true;if(Number(v)!==q.ans[i])document.getElementById(`line-${id}-${i}`).textContent='✓ Correct: '+q.opts[q.ans[i]]});document.getElementById('check-'+id).disabled=true;feedback(q,ok);update()}
function feedback(q,ok){let answer=q.kind==='match'?'':`<div><b>Correct answer${q.ans.length>1?'s':''}:</b> ${q.ans.map(i=>esc(q.opts[i])).join(' · ')}</div>`;document.getElementById('fb-'+q.id).innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'✓ Correct!':'✕ Incorrect'}</b>${!ok?answer:''}<div class="explain">${esc(q.exp)}</div></div>`}
function update(){let completed=Object.values(state).filter(x=>x.done),correct=completed.filter(x=>x.ok).length;document.getElementById('done').textContent=`Answered: ${completed.length} / ${questions.length}`;document.getElementById('score').textContent=`Correct: ${correct}`;document.getElementById('errors').textContent=`Incorrect: ${completed.length-correct}`;document.getElementById('bar').style.width=completed.length/questions.length*100+'%';if(completed.length===questions.length){let end=document.getElementById('end');if(!end){end=document.createElement('div');end.id='end';document.getElementById('questions').append(end)}end.innerHTML=`<div class="card" style="text-align:center"><h2>Quiz completed! 🎉</h2><h1>${correct} / ${questions.length}</h1><p>${Math.round(correct/questions.length*100)}% correct</p><button class="primary" onclick="restart('both')">Try again — shuffle both</button></div>`}}
restart('none');
