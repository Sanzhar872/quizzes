<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Defense — подготовка к экзамену</title>
<style>
:root{--bg:#eef3fa;--bg2:#dbe7f7;--card:#fff;--tx:#1b2430;--mut:#5b6878;--ac:#2563eb;--bd:#d3dce8;--ok:#16a34a;--okb:#e6f6ec;--bad:#dc2626;--badb:#fdeaea;--sel:#e3ecff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111b;--bg2:#16223a;--card:#162033;--tx:#e6edf6;--mut:#94a3b8;--ac:#60a5fa;--bd:#2a3a55;--ok:#4ade80;--okb:#12301f;--bad:#f87171;--badb:#3a1818;--sel:#1e3358}}
:root[data-theme="dark"]{--bg:#0b111b;--bg2:#16223a;--card:#162033;--tx:#e6edf6;--mut:#94a3b8;--ac:#60a5fa;--bd:#2a3a55;--ok:#4ade80;--okb:#12301f;--bad:#f87171;--badb:#3a1818;--sel:#1e3358}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg) linear-gradient(160deg,var(--bg),var(--bg2)) fixed;transition:background .3s,color .3s}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:0 0 6px;font-weight:800}
.sub{color:var(--mut);margin:0 0 14px}
pre.st{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;margin:0 0 14px}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:10px;margin:22px 0 0;padding-bottom:16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tabs .pill{padding:12px 20px;font-size:16px;font-weight:700;border-radius:12px}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ctrl{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
select{padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;min-width:170px}
select.ok{border-color:var(--ok);background:var(--okb)}select.bad{border-color:var(--bad);background:var(--badb)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:16px 0 14px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.g{min-width:36px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font:13px ui-monospace,Menlo,monospace;cursor:pointer}
.g.cur{border-color:var(--ac);color:var(--ac);font-weight:700;box-shadow:0 0 0 1px var(--ac)}
.g.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.g.bad{background:var(--badb);border-color:var(--bad);color:var(--bad)}.g.an{background:var(--sel);color:var(--ac)}
.qc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.tag{display:flex;gap:10px;align-items:center;font:12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.tag b{background:var(--sel);color:var(--ac);padding:4px 9px;border-radius:6px}
h2{font-size:19px;line-height:1.45;margin:14px 0 16px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:1.5px solid var(--bd);border-radius:14px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt:disabled{cursor:default;color:var(--tx)}
.mk{flex:none;width:22px;height:22px;border:2px solid var(--mut);border-radius:50%}
.mk.sq{border-radius:6px}
.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.sel .mk{background:var(--ac);border-color:var(--ac);box-shadow:inset 0 0 0 4px var(--card)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok .mk{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 4px var(--card)}
.opt.bad{background:var(--badb);border-color:var(--bad)}.opt.bad .mk{background:var(--bad);border-color:var(--bad);box-shadow:inset 0 0 0 4px var(--card)}
.mrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:10px 0}
.hint{color:var(--mut);font-size:14px}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
.exp.g{background:var(--okb);border-left:4px solid var(--ok)}.exp.r{background:var(--badb);border-left:4px solid var(--bad)}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:12px 20px;border:1.5px solid var(--ac);border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ac)}
.big{font-size:48px;font-weight:700;margin:8px 0}.big small{font-size:22px;color:var(--mut)}
.wr{border-top:1px solid var(--bd);padding:14px 0;font-size:15px}
.wr small{color:var(--ok);display:block;margin:4px 0}.mut{color:var(--mut)}
@media(max-width:520px){.mrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Network Defense: подготовка к экзамену</h1>
<p class="sub">24 вопроса · Модули 1–3 · защита сетей и конечных точек</p>
<pre class="st" id="st"></pre>
<button class="pill" id="th"></button>
<div class="tabs"><button class="pill" data-tab="notes">Конспект</button><button class="pill" data-tab="train">Тренировка</button><button class="pill" data-tab="exam">Экзамен</button></div>
<div id="app"></div>
</div>
<script>
const Q=[
{q:"Which security management function is concerned with the inventory and control of hardware and software configurations of systems?",o:["configuration management","vulnerability management","risk management","asset management"],a:[0],e:"Configuration management covers the inventory and control of hardware and software configurations."},
{q:"What device would be used as a second line of defense in a defense-in-depth approach?",o:["edge router","internal router","switch","firewall"],a:[3],e:"The edge router is the first line, the firewall is the second, the internal router is the third."},
{q:"Which security measure is typically found both inside and outside a data center facility?",o:["biometrics access","continuous video surveillance","a gate","exit sensors","security traps"],a:[1],e:"Continuous video surveillance is used both outside and inside. A gate is perimeter-only; traps, biometrics and exit sensors are inside."},
{q:"What is a characteristic of the security artichoke, defense-in-depth approach?",o:["Threat actors can easily compromise all layers safeguarding the data or systems.","Each layer has to be penetrated before the threat actor can reach the target data or system.","Threat actors no longer have to peel away each layer before reaching the target data or system.","Threat actors can no longer penetrate any layers safeguarding the data or system."],a:[2],e:"In the artichoke approach not every layer must be penetrated: each layer protects, but also provides a path to attack."},
{q:"Which two options are security best practices that help mitigate BYOD risks? (Choose two.)",o:["Only turn on Wi-Fi when using the wireless network.","Only allow devices that have been approved by the corporate IT team.","Use paint that reflects wireless signals and glass that prevents the signals from going outside the building.","Keep the device OS and software updated.","Decrease the wireless antenna gain level.","Use wireless MAC address filtering."],a:[0,3],e:"BYOD best practices: turn off Wi-Fi/Bluetooth when not used, keep OS and software updated, use unique passwords, backup, remote wipe, MDM."},
{q:"Which type of business policy establishes the rules of conduct and the responsibilities of employees and employers?",o:["data","security","company","employee"],a:[2],e:"Company policies establish the rules of conduct and the responsibilities of both employees and employers."},
{q:"Match the term to the description.",m:[["threats","potential dangers to a protected asset"],["vulnerabilities","weaknesses in a system or design"],["assets","information or equipment valuable enough to an organization to warrant protection"]],e:"Correct matching:"},
{q:"Which network monitoring tool is in the category of network protocol analyzers?",o:["Wireshark","SIEM","SPAN","SNMP"],a:[0],e:"Wireshark is a network protocol analyzer used to capture network traffic (saved in PCAP files)."},
{q:"What is a strength of using a hashing function?",o:["It is a one-way function and not reversible.","Two different files can be created that have the same output.","It is not commonly used in security.","It can take only a fixed length message.","It has a variable length output."],a:[0],e:"A hash function is one-way, takes input of arbitrary length and produces fixed-length output."},
{q:"A user has created a new program and wants to distribute it to everyone in the company. The user wants to ensure that when the program is downloaded that the program is not changed while in transit. What can the user do to ensure that the program is not changed when downloaded?",o:["Encrypt the program and require a password after it is downloaded.","Create a hash of the program file that can be used to verify the integrity of the file after it is downloaded.","Turn off antivirus on all the computers.","Install the program on individual computers.","Distribute the program on a thumb drive."],a:[1],e:"Hashing is a method to ensure integrity and ensures that the data is not changed."},
{q:"What is a purpose of implementing VLANs on a network?",o:["They eliminate network collisions.","They prevent Layer 2 loops.","They can separate user traffic.","They allow switches to forward Layer 3 packets without a router."],a:[2],e:"VLANs separate user traffic by function, project team or application, regardless of physical location."},
{q:"A user is purchasing a new server for the company data center. The user wants disk striping with parity on three disks. Which RAID level should the user implement?",o:["1+0","0","5","1"],a:[2],e:"RAID 5 is striping with parity."},
{q:"A company is developing an internet store website. Which protocol should be used to transfer credit card information from customers to the company web server?",o:["FTPS","HTTP","HTTPS","SSH","WPA2"],a:[2],e:"HTTPS uses SSL/TLS to encrypt communication between client and server, protecting confidentiality."},
{q:"Why is asset management a critical function of a growing organization against security threats?",o:["It serves to preserve an audit trail of all new purchases.","It allows for a build of a comprehensive AUP.","It identifies the ever increasing attack surface to threats.","It prevents theft of older assets that are decommissioned."],a:[2],e:"As an organization grows, so does the attack surface; asset management inventories assets and the risks to them."},
{q:"What is an example of the implementation of physical security?",o:["ensuring that all operating system and antivirus software is up to date","encrypting all sensitive data that is stored on the servers","requiring employees to use a card key when entering a secure area","establishing personal firewalls on each computer"],a:[2],e:"Encryption, updates and personal firewalls are security measures, but they do not restrict physical access to authorized people."},
{q:"A large retail company uses EAP-based authentication in conjunction with 802.1x. When the client first initiates communication on the wireless network, which type of authentication method is used by the client to associate with the AP?",o:["WPA3","Open Authentication","WPA","WPA2"],a:[1],e:"With 802.1X and EAP, the wireless device first uses Open Authentication to associate with the AP; real authentication follows with the server."},
{q:"What are three examples of administrative access controls? (Choose three.)",o:["hiring practices","background checks","encryption","guard dogs","policies and procedures","intrusion detection system (IDS)"],a:[0,1,4],e:"Administrative controls: policies, procedures, hiring practices, background checks, data classification."},
{q:"Which access control model applies the strictest access control and is often used in military or mission critical applications?",o:["attribute-based","nondiscretionary","mandatory","discretionary"],a:[2],e:"Mandatory access control (MAC) applies the strictest access control to protect network resources."},
{q:"What is the purpose of the network security authentication function?",o:["to keep track of the actions of a user","to require users to prove who they are","to determine which resources a user can access","to provide challenge and response questions"],a:[1],e:"AAA: authentication proves who users are, authorization determines resources, accounting tracks actions."},
{q:"A network administrator is configuring an AAA server to manage RADIUS authentication. Which two features are included in RADIUS authentication? (Choose two.)",o:["single process for authentication and authorization","encryption for only the data","encryption for all communication","separate processes for authentication and authorization","hidden passwords during transmission"],a:[0,4],e:"RADIUS combines authentication and authorization in one process and encrypts only the password."},
{q:"Passwords, passphrases, and PINs are examples of which security term?",o:["access","authentication","identification","authorization"],a:[1],e:"These are authentication methods used to strengthen access control systems."},
{q:"An intern has started working in the support group. One duty is to set local policy for passwords on the workstations. What tool would be best to use?",o:["gpedit.msc","password policy","secpol.msc","system administration","account policy"],a:[2],e:"Local security policies (secpol.msc) work only on the local machine and can be overridden by a Windows domain."},
{q:"What is privilege escalation?",o:["Everyone is given full rights by default to everything and rights are taken away only when someone abuses privileges.","A security problem occurs when high ranking corporate officials demand rights to systems or files that they should not have.","Someone is given rights because she or he has received a promotion.","Vulnerabilities in systems are exploited to grant higher levels of privilege than someone or some process should have."],a:[3],e:"With privilege escalation, vulnerabilities are exploited to gain a higher level of privilege, then the attacker accesses sensitive data."},
{q:"Which access control model allows users to control access to data as an owner of that data?",o:["nondiscretionary access control","mandatory access control","attribute-based access control","discretionary access control"],a:[3],e:"In the discretionary access control (DAC) model, users control access to data as owners of the data."}
];
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={ok:[],bad:[],best:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem('np')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('np',JSON.stringify(S))}catch(e){}};
let tab='train',list=[],pos=0,A={},P={},perm={},fo='all',oo='shuf';
const stats=()=>{$('#st').textContent=`решено верно: ${S.ok.length}/${Q.length}\nошибок в списке: ${S.bad.length}\nлучший экзамен: ${S.best}%`};
const ans=x=>x.m?x.m.map(p=>p[0]+' → '+p[1]).join('; '):x.a.map(k=>x.o[k]).join(' · ');
function mark(id,ok){S.ok=S.ok.filter(x=>x!==id);S.bad=S.bad.filter(x=>x!==id);(ok?S.ok:S.bad).push(id);save();stats()}
function setTab(t){tab=t;document.querySelectorAll('.tabs .pill').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 if(t==='notes')return notes();
 if(t==='exam'){list=sh(Q.map((_,i)=>i));A={};P={};perm={};pos=0}else build();
 view()}
function build(){let ids=Q.map((_,i)=>i);
 if(fo==='bad')ids=ids.filter(i=>S.bad.includes(i));else if(fo==='new')ids=ids.filter(i=>!S.ok.includes(i)&&!S.bad.includes(i));
 list=oo==='shuf'?sh(ids):ids;A={};P={};perm={};pos=0}
const ctrl=()=>tab!=='train'?'':`<div class="ctrl"><select id="f"><option value="all">Все вопросы</option><option value="bad">Только ошибки</option><option value="new">Нерешённые</option></select><select id="o"><option value="shuf">Вперемешку</option><option value="ord">По порядку</option></select></div>`;
function view(){
 const ex=tab==='exam',h0=ctrl();
 if(!list.length){app.innerHTML=h0+'<p class="hint">В этом списке пока нет вопросов.</p>';return bind()}
 const id=list[pos],q=Q[id],a=A[id],n=Object.keys(A).length,multi=!q.m&&q.a.length>1;
 let h=h0+`<div class="bar"><i style="width:${n/list.length*100}%"></i></div><div class="grid">${list.map((x,i)=>`<button class="g${i===pos?' cur':''}${A[x]?(ex?' an':A[x].ok?' ok':' bad'):''}" data-p="${i}">${i+1}</button>`).join('')}</div>`;
 h+=`<div class="qc"><div class="tag"><b>№ ${pos+1}</b><span>${q.m?'сопоставление':multi?'несколько ответов ('+q.a.length+')':'один ответ'}</span></div><h2>${q.q}</h2>`;
 if(q.m){
  const pm=perm[id]=perm[id]||{t:sh(q.m.map((_,i)=>i)),d:sh(q.m.map((_,i)=>i))};
  h+=pm.t.map(t=>`<div class="mrow"><b>${q.m[t][0]}</b><select data-t="${t}" ${a?'disabled':''}><option value="">— выберите —</option>${pm.d.map(d=>`<option value="${d}">${q.m[d][1]}</option>`).join('')}</select></div>`).join('');
 }else{
  const pm=perm[id]=perm[id]||sh(q.o.map((_,i)=>i)),cur=a?a.sel:[...(P[id]||[])];
  h+=pm.map(i=>{let c='';if(a&&!ex){if(q.a.includes(i))c=' ok';else if(cur.includes(i))c=' bad'}else if(cur.includes(i))c=' sel';
   return `<button class="opt${c}" data-i="${i}" ${a?'disabled':''}><span class="mk${multi?' sq':''}"></span>${q.o[i]}</button>`}).join('');
 }
 if(a&&!ex)h+=`<div class="exp ${a.ok?'g':'r'}"><b>${a.ok?'Верно!':'Неверно.'}</b> ${q.e}${q.m?'<br>'+q.m.map(p=>`<b>${p[0]}</b> → ${p[1]}`).join('<br>'):''}</div>`;
 if(a&&ex)h+=`<p class="hint">Ответ сохранён. Результат — после завершения экзамена.</p>`;
 h+=`<div class="row">`;
 if(!a&&(q.m||multi))h+=`<button class="btn" id="sub">Ответить</button>`;
 if(pos<list.length-1)h+=`<button class="btn${a?'':' sec'}" id="nx">Далее →</button>`;
 if(ex)h+=`<button class="btn sec" id="fin">Завершить экзамен (${n}/${list.length})</button>`;
 app.innerHTML=h+`</div></div>`;
 if(q.m&&a)document.querySelectorAll('.mrow select').forEach(s=>{const v=a.sel[s.dataset.t];s.value=v;if(!ex)s.classList.add(v==s.dataset.t?'ok':'bad')});
 bind();
}
function bind(){
 const f=$('#f'),o=$('#o');
 if(f){f.value=fo;o.value=oo;f.onchange=()=>{fo=f.value;build();view()};o.onchange=()=>{oo=o.value;build();view()}}
 if(!list.length)return;
 document.querySelectorAll('.g').forEach(b=>b.onclick=()=>{pos=+b.dataset.p;view()});
 const id=list[pos],q=Q[id];
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(q.a.length===1)return submit(id,[i]);
  const s=P[id]=P[id]||new Set();if(s.has(i))s.delete(i);else if(s.size<q.a.length)s.add(i);view()});
 const sb=$('#sub');if(sb)sb.onclick=()=>{
  if(q.m){const s=[...document.querySelectorAll('.mrow select')];if(s.some(x=>!x.value))return;const o={};s.forEach(x=>o[x.dataset.t]=x.value);submit(id,o)}
  else{const s=P[id]||new Set();if(s.size!==q.a.length)return;submit(id,[...s])}};
 const nx=$('#nx');if(nx)nx.onclick=()=>{pos++;view()};
 const fi=$('#fin');if(fi)fi.onclick=finish;
}
function submit(id,sel){const q=Q[id];
 const ok=q.m?Object.keys(sel).every(t=>sel[t]==t):q.a.length===sel.length&&q.a.every(i=>sel.includes(i));
 A[id]={ok,sel};if(tab==='train')mark(id,ok);view()}
function finish(){
 let sc=0;const wr=[];
 list.forEach(id=>{const ok=A[id]&&A[id].ok;if(ok)sc++;else wr.push(id);mark(id,!!ok)});
 const p=Math.round(sc/list.length*100);S.best=Math.max(S.best,p);save();stats();
 app.innerHTML=`<div class="tag"><b>Результат экзамена</b></div><div class="big">${sc} / ${list.length} <small>(${p}%)</small></div><p>${p>=90?'Отлично, ты готов!':p>=70?'Хорошо, осталось добить ошибки.':'Стоит повторить материал.'}</p><div class="row"><button class="btn" id="re">Новый экзамен</button>${wr.length?`<button class="btn sec" id="er">Тренировать ошибки (${wr.length})</button>`:''}</div>${wr.map(i=>`<div class="wr">${Q[i].q}<small>✔ ${ans(Q[i])}</small></div>`).join('')}`;
 $('#re').onclick=()=>setTab('exam');
 if($('#er'))$('#er').onclick=()=>{fo='bad';setTab('train')};
}
function notes(){app.innerHTML=`<div class="ctrl"><span class="tag"><b>Конспект</b><span>вопросы, верные ответы и пояснения</span></span></div>`+Q.map((x,i)=>`<div class="wr"><b>${i+1}. ${x.q}</b><small>✔ ${ans(x)}</small><div class="mut">${x.e}</div></div>`).join('')}
/* theme */
const th=$('#th');
function setTheme(t,sv){document.documentElement.dataset.theme=t;th.textContent=t==='dark'?'Светлая тема':'Тёмная тема';if(sv)try{localStorage.setItem('theme',t)}catch(e){}}
let t0=null;try{t0=localStorage.getItem('theme')}catch(e){}
setTheme(t0||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
th.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true);
document.querySelectorAll('.tabs .pill').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
stats();setTab('train');
</script>
</body>
</html>
