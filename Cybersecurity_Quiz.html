</style><main><h1>Cybersecurity Quiz</h1><div class="toolbar" id="tabs"></div><div class="toolbar"><button id="sq">Перемешать вопросы</button><button id="sa">Перемешать ответы</button><button id="reset">Начать заново</button><button id="retry">Повторить ошибки</button></div><div class="stats" id="stats"></div><div id="quiz"></div><div class="footer" id="result"></div></main><script>
const data={"22-26": [{"n": 1, "s": "A company has had several incidents involving users downloading unauthorized software, using unauthorized websites, and using personal USB devices. The CIO wants to put in place a scheme to manage the user threats. What three things might be put in place to manage the threats? (Choose three.)", "o": ["Use content filtering.", "Disable CD and USB access.", "Provide security awareness training.", "Monitor all activity by the users.", "Change to thin clients.", "Implement disciplinary action."], "k": [0, 1, 2]}, {"n": 2, "s": "Which threat is mitigated through user awareness training and tying security awareness to performance reviews?", "o": ["user-related threats", "physical threats", "device-related threats", "cloud-related threats"], "k": [0]}, {"n": 3, "s": "What is the workforce framework category that includes highly specialized review and evaluation of incoming cybersecurity information to determine if it is useful for intelligence?", "o": ["Analyze", "Oversight and Development", "Securely Provision", "Protect and Defend"], "k": [0]}, {"n": 4, "s": "A breach occurs in a company that processes credit card information. Which industry specific law governs credit card data protection?", "o": ["SOX", "GLBA", "ECPA", "PCI DSS"], "k": [3]}, {"n": 5, "s": "As part of HR policy in a company, an individual may opt-out of having information shared with any third party other than the employer. Which law protects the privacy of personal shared information?", "o": ["SOX", "PCI", "FIRPA", "GLBA"], "k": [3]}, {"n": 6, "s": "What type of network security test can detect and report changes made to network systems?", "o": ["integrity checking", "network scanning", "penetration testing", "vulnerability scanning"], "k": [0]}, {"n": 7, "s": "A security professional is asked to perform an analysis of the current state of a company network. What tool would the security professional use to scan the network only for security risks?", "o": ["pentest", "malware", "packet analyzer", "vulnerability scanner"], "k": [3]}, {"n": 8, "s": "What information does the SIEM network security management tool provide to network administrators?", "o": ["real time reporting and analysis of security events", "a map of network systems and services", "assessment of system security configurations", "detection of open TCP and UDP ports"], "k": [0]}, {"n": 9, "s": "What type of network security test uses simulated attacks to determine the feasibility of an attack as well as the possible consequences if the attack occurs?", "o": ["integrity checking", "penetration testing", "vulnerability scanning", "network scanning"], "k": [1]}, {"n": 10, "s": "What network testing tool would an administrator use to assess and validate system configurations against security policies and compliance standards?", "o": ["Nessus", "Tripwire", "L0phtcrack", "Metasploit"], "k": [1]}, {"n": 11, "s": "Which statement describes Trusted Automated Exchange of Indicator Information (TAXII)?", "o": ["It is a dynamic database of real-time vulnerabilities.", "It is a signature-less engine utilizing stateful attack analysis to detect zero-day threats.", "It is the specification for an application layer protocol that allows the communication of CTI over HTTPS.", "It is a set of specifications for exchanging cyber threat information between organizations."], "k": [2]}, {"n": 12, "s": "How does AIS address a newly discovered threat?", "o": ["by creating response strategies against the new threat", "by enabling real-time exchange of cyberthreat indicators with U.S. Federal Government and the private sector", "by mitigating the attack with active response defense mechanisms", "by advising the U.S. Federal Government to publish internal response strategies"], "k": [1]}, {"n": 13, "s": "Which organization defines unique CVE Identifiers for publicly known information-security vulnerabilities that make it easier to share data?", "o": ["FireEye", "DHS", "Cisco Talos", "MITRE"], "k": [3]}, {"n": 14, "s": "In addressing an identified risk, which strategy aims to decrease the risk by taking measures to reduce vulnerability?", "o": ["risk sharing", "risk retention", "risk reduction", "risk avoidance"], "k": [2]}, {"n": 15, "s": "Which step in the Vulnerability Management Life Cycle determines a baseline risk profile to eliminate risks based on asset criticality, vulnerability threat, and asset classification?", "o": ["verify", "assess", "discover", "prioritize assets"], "k": [1]}, {"n": 16, "s": "When establishing a network profile for an organization, which element describes the time between the establishment of a data flow and its termination?", "o": ["total throughput", "bandwidth of the Internet connection", "routing protocol convergence", "session duration"], "k": [3]}, {"n": 17, "s": "Which security management plan specifies a component that involves tracking the location and configuration of networked devices and software across an enterprise?", "o": ["asset management", "patch management", "vulnerability management", "risk management"], "k": [0]}, {"n": 18, "s": "A security analyst is investigating a cyber attack that began by compromising one file system through a vulnerability in a custom software application. The attack now appears to be affecting additional file systems under the control of another security authority. Which CVSS v3.0 base exploitability metric score is increased by this attack characteristic?", "o": ["user interaction", "privileges required", "attack complexity", "scope"], "k": [3]}, {"n": 19, "s": "What are the steps in the vulnerability management life cycle?", "o": ["plan, do, act, check", "identify, protect, detect, respond, recover", "detect, analyze, recover, respond", "discover, prioritize assets, assess, report, remediate, verify"], "k": [3]}, {"n": 20, "s": "Why would an organization perform a quantitative risk analysis for network security threats?", "o": ["so that management has documentation about the number of security attacks that have occurred within a particular time period", "so that management can determine the number of network devices needed to inspect, analyze, and protect the corporate resources", "so that the organization knows the top areas where network security holes exist", "so that the organization can focus resources where they are most needed"], "k": [3]}, {"n": 21, "s": "The team is in the process of performing a risk analysis on the database services. The information collected includes the initial value of these assets, the threats to the assets and the impact of the threats. What type of risk analysis is the team performing by calculating the annual loss expectancy?", "o": ["protection analysis", "qualitative analysis", "loss analysis", "quantitative analysis"], "k": [3]}, {"n": 22, "s": "Based on the risk management process, what should the cybersecurity team do as the next step when a cybersecurity risk is identified?", "o": ["Frame the risk.", "Monitor the risk.", "Respond to the risk.", "Assess the risk."], "k": [3]}, {"n": 23, "s": "In which situation would a detective control be warranted?", "o": ["after the organization has experienced a breach in order to restore everything back to a normal state", "when the organization needs to repair damage", "when the organization needs to look for prohibited activity", "when the organization cannot use a guard dog, so it is necessary to consider an alternative"], "k": [2]}, {"n": 24, "s": "Which risk mitigation strategies include outsourcing services and purchasing insurance?", "o": ["transfer", "acceptance", "reduction", "avoidance"], "k": [0]}, {"n": 25, "s": "In quantitative risk analysis, what term is used to represent the degree of destruction that would occur if an event took place?", "o": ["exposure factor", "single loss expectancy", "annualized rate of occurrence", "annualized loss expectancy"], "k": [0]}, {"n": 26, "s": "Which two values are required to calculate annual loss expectancy? (Choose two.)", "o": ["annual rate of occurrence", "asset value", "frequency factor", "exposure factor", "single loss expectancy", "quantitative loss value"], "k": [0, 4]}, {"n": 27, "s": "What are the three impact metrics contained in the CVSS 3.0 Base Metric Group? (Choose three.)", "o": ["confidentiality", "remediation level", "integrity", "attack vector", "exploit", "availability"], "k": [0, 2, 5]}, {"n": 28, "s": "Match the network profile element to the description.", "l": ["the amount of data passing from a given source to a given destination in a given period of time", "the time between the establishment of a data flow and its termination", "the IP addresses or the logical location of essential systems or data", "a list of TCP or UDP processes that are available to accept data"], "o": ["ports used", "total throughput", "critical asset address space", "session duration"], "k": [1, 3, 2, 0]}, {"n": 30, "s": "Match the security management function with the description.", "l": ["configuration management", "vulnerability management", "risk management", "asset management"], "o": ["the comprehensive analysis of impacts of attacks on core company assets and functioning", "the implementation of systems that track the location and configuration of networked devices and software across an enterprise", "the security practice designed to proactively prevent the exploitation of IT vulnerabilities that exist within an organization", "the inventory and control of hardware and software configurations of systems"], "k": [3, 2, 0, 1]}], "27": [{"n": 1, "s": "Which type of data would be considered an example of volatile data?", "o": ["temp files", "web browser cache", "memory registers", "log files"], "k": [2]}, {"n": 2, "s": "Keeping data backups offsite is an example of which type of disaster recovery control?", "o": ["preventive", "corrective", "detective", "management"], "k": [0]}, {"n": 3, "s": "Which NIST-defined incident response stakeholder is responsible for coordinating incident response with other stakeholders and minimizing the damage of an incident?", "o": ["management", "IT support", "the legal department", "human resources"], "k": [0]}, {"n": 4, "s": "What type of exercise interrupts services to verify that all aspects of a business continuity plan are able to respond to a certain type of incident?", "o": ["Tabletop exercise", "Functional test", "Operational exercise"], "k": [2]}, {"n": 5, "s": "Match the intrusion event defined in the Diamond Model of intrusion to the description.", "l": ["the target of the attack", "network path used to establish and maintain command and control", "a tool or technique used to attack the victim", "the parties responsible for the intrusion"], "o": ["adversary", "capability", "victim", "infrastructure"], "k": [2, 3, 1, 0]}, {"n": 6, "s": "What is a chain of custody?", "o": ["the disciplinary measures an organization may perform if an incident is caused by an employee", "the documentation surrounding the preservation of evidence related to an incident", "a plan ensuring that each party involved in an incident response understands how to collect evidence", "a list of all of the stakeholders that were exploited by an attacker"], "k": [1]}, {"n": 7, "s": "According to the Cyber Kill Chain model, after a weapon is delivered to a targeted system, what is the next step that a threat actor would take?", "o": ["installation", "action on objectives", "exploitation", "weaponization"], "k": [2]}, {"n": 8, "s": "In which step of the NIST incident response process does the CSIRT perform an analysis to determine which networks, systems, or applications are affected; who or what originated the incident; and how the incident is occurring?", "o": ["detection", "attacker identification", "scoping", "incident notification"], "k": [2]}, {"n": 9, "s": "Which task describes threat attribution?", "o": ["obtaining the most volatile evidence", "reporting the incident to the proper authorities", "evaluating the server alert data", "determining who is responsible for the attack"], "k": [3]}, {"n": 10, "s": "Place the seven steps defined in the Cyber Kill Chain in the correct order.", "l": ["step 1", "step 2", "step 3", "step 4", "step 5", "step 6", "step 7"], "o": ["weaponization", "exploitation", "delivery", "reconnaissance", "command and control", "action on objectives", "installation"], "k": [3, 0, 2, 1, 6, 4, 5]}, {"n": 11, "s": "Match the NIST incident response stakeholder with the role.", "l": ["preserves attack evidence", "performs disciplinary measures", "develops firewall rules", "designs the budget", "reviews policies for local or federal guideline violations"], "o": ["human resources", "IT support", "management", "information assurance", "legal department"], "k": [1, 0, 3, 2, 4]}, {"n": 12, "s": "Which type of controls restore the system after a disaster or an event?", "o": ["Preventive controls", "Detective controls", "Corrective controls"], "k": [2]}, {"n": 13, "s": "A company is applying the NIST.SP800-61 r2 incident handling process to security events. What are two examples of incidents that are in the category of precursor? (Choose two.)", "o": ["a host that has been verified as infected with malware", "multiple failed logins from an unknown source", "an IDS alert message being sent", "log entries that show a response to a port scan", "a newly-discovered vulnerability in Apache web servers"], "k": [3, 4]}, {"n": 14, "s": "What will a threat actor do to create a back door on a compromised target according to the Cyber Kill Chain model?", "o": ["Add services and autorun keys.", "Open a two-way communications channel to the CnC infrastructure.", "Obtain an automated tool to deliver the malware payload.", "Collect and exfiltrate data."], "k": [0]}, {"n": 15, "s": "What is the objective the threat actor in establishing a two-way communication channel between the target system and a CnC infrastructure?", "o": ["to allow the threat actor to issue commands to the software that is installed on the target", "to steal network bandwidth from the network where the target is located", "to send user data stored on the target to the threat actor", "to launch a buffer overflow attack"], "k": [0]}, {"n": 16, "s": "Which type of evidence supports an assertion based on previously obtained evidence?", "o": ["best evidence", "direct evidence", "indirect evidence", "corroborating evidence"], "k": [3]}, {"n": 17, "s": "What is specified in the plan element of the NIST incident response plan?", "o": ["metrics for measuring the incident response capability and effectiveness", "incident handling based on the mission of the organization", "organizational structure and the definition of roles, responsibilities, and levels of authority", "priority and severity ratings of incidents"], "k": [0]}, {"n": 18, "s": "A cybersecurity analyst has been called to a crime scene that contains several technology items including a computer. Which technique will be used so that the information found on the computer can be used in court?", "o": ["log collection", "Tor", "rootki", "unaltered disk image"], "k": [3]}, {"n": 19, "s": "According to NIST, which step in the digital forensics process involves identifying potential sources of forensic data, its acquisition, handling, and storage?", "o": ["reporting", "examination", "collection", "analysis"], "k": [2]}, {"n": 20, "s": "Which activity is typically performed by a threat actor in the installation phase of the Cyber Kill Chain?", "o": ["Obtain an automated tool to deliver the malware payload.", "Harvest email addresses of user accounts.", "Install a web shell on the target web server for persistent access.", "Open a two-way communication channel to the CnC infrastructure."], "k": [2]}]};const ids=Object.keys(data);let tab=ids[0];const states={};const range=n=>Array.from({length:n},(_,i)=>i);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function fresh(t){return {order:range(data[t].length),items:data[t].map(q=>({order:range(q.o.length),sel:[],pairs:{},pending:null,done:false,ok:false}))}}ids.forEach(t=>states[t]=fresh(t));const el=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};const btn=(txt,fn,cls)=>{let b=el('button',txt,cls);b.onclick=fn;return b};function stats(){let st=states[tab],done=st.order.filter(i=>st.items[i].done),ok=done.filter(i=>st.items[i].ok).length,n=st.order.length;let s=document.getElementById('stats');s.replaceChildren(el('div',`Отвечено: ${done.length}/${n} · Правильно: ${ok} · Ошибки: ${done.length-ok} · Результат: ${Math.round(100*ok/n)}%`));let p=el('progress');p.max=n;p.value=done.length;s.append(p);document.getElementById('retry').disabled=done.length===ok;document.getElementById('result').textContent=done.length===n?`Тест завершён! ${ok} из ${n} (${Math.round(100*ok/n)}%).`:''}function check(q,s){s.done=true;s.ok=q.l?q.k.every((v,i)=>s.pairs[i]===v):s.sel.length===q.k.length&&q.k.every(v=>s.sel.includes(v));stats()}
function draw(w,q,s){let svg=w.querySelector('svg');if(!svg)return;svg.replaceChildren();let r=w.getBoundingClientRect();function line(i,j,color,dash){let a=w.querySelector(`[data-left="${i}"]`).getBoundingClientRect(),b=w.querySelector(`[data-right="${j}"]`).getBoundingClientRect();let l=document.createElementNS('http://www.w3.org/2000/svg','line');for(let [k,v] of Object.entries({x1:a.right-r.left,y1:a.top+a.height/2-r.top,x2:b.left-r.left,y2:b.top+b.height/2-r.top,stroke:color,'stroke-width':3,'stroke-dasharray':dash?'6 4':'none'}))l.setAttribute(k,v);svg.append(l)}Object.entries(s.pairs).forEach(([i,j])=>line(i,j,s.done?(q.k[i]===j?'#239b56':'#dc4444'):'#3185c6',false));if(s.done)q.k.forEach((j,i)=>{if(s.pairs[i]!==j)line(i,j,'#239b56',true)})}
function render(){let st=states[tab];let tabs=document.getElementById('tabs');tabs.replaceChildren(...ids.map(t=>btn(`${t} (${data[t].length})`,()=>{tab=t;render()},t===tab?'active':'')));let root=document.getElementById('quiz');root.replaceChildren();st.order.forEach((idx,pos)=>{let q=data[tab][idx],s=st.items[idx],card=el('section',undefined,'card');root.append(card);function paint(){card.replaceChildren(el('div',`Вопрос ${pos+1} из ${st.order.length} · ${q.l?'Matching':q.k.length>1?'Multiple choice':'Single choice'}`,'muted'),el('h3',q.s));if(q.l){card.append(el('div','Нажми на элемент слева, затем на соответствующий элемент справа.','muted'));let w=el('div',undefined,'match'),left=el('div',undefined,'side'),right=el('div',undefined,'side');let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');w.append(svg,left,right);q.l.forEach((v,i)=>{let b=btn(v,()=>{s.pending=i;paint()},s.pending===i?'selected':'');b.dataset.left=i;b.disabled=s.done;left.append(b)});s.order.forEach(j=>{let b=btn(q.o[j],()=>{if(s.pending===null)return;for(let i of Object.keys(s.pairs))if(s.pairs[i]===j)delete s.pairs[i];s.pairs[s.pending]=j;s.pending=null;paint()});b.dataset.right=j;b.disabled=s.done;right.append(b)});card.append(w);requestAnimationFrame(()=>draw(w,q,s));if(!s.done){let b=btn('Проверить',()=>{check(q,s);paint()},'primary');b.disabled=Object.keys(s.pairs).length!==q.l.length;card.append(b,btn('Очистить линии',()=>{s.pairs={};s.pending=null;paint()}))}}else{s.order.forEach(j=>{let selected=s.sel.includes(j);let cls='opt '+(s.done?(q.k.includes(j)?'good':selected?'bad':''):selected?'selected':'');let b=btn((q.k.length>1?(selected?'☑ ':'☐ '):'')+q.o[j],()=>{if(q.k.length===1){s.sel=[j];check(q,s)}else{s.sel=selected?s.sel.filter(x=>x!==j):[...s.sel,j]}paint()},cls);b.disabled=s.done;card.append(b)});if(q.k.length>1&&!s.done){let b=btn('Проверить',()=>{check(q,s);paint()},'primary');b.disabled=s.sel.length!==q.k.length;card.append(b,el('div',`Выбрано: ${s.sel.length}/${q.k.length}`,'muted'))}}if(s.done){let f=el('div',s.ok?'✓ Правильно':'✗ Неправильно','feedback');if(!s.ok){if(q.l)q.l.forEach((v,i)=>f.append(el('p',v+' → '+q.o[q.k[i]])));else f.append(el('p','Правильный ответ: '+q.k.map(j=>q.o[j]).join('; ')))}card.append(f)}}paint()});stats()}
document.getElementById('sq').onclick=()=>{states[tab].order=shuffle(states[tab].order);render()};document.getElementById('sa').onclick=()=>{states[tab].items.forEach(s=>s.order=shuffle(s.order));render()};document.getElementById('reset').onclick=()=>{states[tab]=fresh(tab);render()};document.getElementById('retry').onclick=()=>{let old=states[tab],wrong=old.order.filter(i=>old.items[i].done&&!old.items[i].ok);if(!wrong.length)return;let st=fresh(tab);st.order=wrong;wrong.forEach(i=>st.items[i].order=[...old.items[i].order]);states[tab]=st;render()};window.addEventListener('resize',()=>{document.querySelectorAll('.match').forEach(w=>{let card=w.closest('.card'),pos=[...document.getElementById('quiz').children].indexOf(card),idx=states[tab].order[pos];draw(w,data[tab][idx],states[tab].items[idx])})});render();</script></html>
